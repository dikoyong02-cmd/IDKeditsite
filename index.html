<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간편 동영상 편집기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input, button {
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
        }
        /* 애니메이션 대상 박스 */
        #targetBox {
            width: 100px;
            height: 100px;
            background-color: #ff6b6b;
            margin: 20px auto;
            border-radius: 12px;
            transition: transform 1s ease-in-out, opacity 1s ease-in-out;
        }
        .action-btn {
            background-color: #339af0;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .save-btn {
            background-color: #51cf66;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1번 영역: 동영상 파일 선택 -->
    <div class="container">
        <h2>동영상 편집 업로드</h2>
        <p>편집할 동영상을 선택해 주세요 (구형 폰 배려 가벼운 모드)</p>
        
        <input type="file" id="videoFile" accept="video/*">
        <br>
        <p id="status" style="margin-top: 15px; color: blue; font-size: 14px;"></p>
    </div>

    <!-- 2번 영역: 키프레임 애니메이션 테스트 -->
    <div class="container">
        <h2>키프레임 애니메이션</h2>
        <p>요소가 움직이는 효과를 미리 확인하세요.</p>

        <div id="targetBox"></div>

        <button class="action-btn" onclick="playAnimation()">애니메이션 재생</button>
    </div>

    <!-- 3번 영역: 기기 파일 저장 (다운로드) -->
    <div class="container">
        <h2>프로젝트 파일 저장</h2>
        <p>현재 편집 설정을 내 기기에 파일로 저장합니다.</p>
        <button class="save-btn" onclick="saveProjectToDevice()">기기에 파일 저장하기</button>
    </div>

    <script>
        // [기능 1] 파일 선택 감지
        const fileInput = document.getElementById('videoFile');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                status.innerText = `선택된 파일: ${fileInput.files[0].name}`;
            }
        });

        // [기능 2] 키프레임 애니메이션 실행
        const keyframes = {
            start: { x: 0, scale: 1, opacity: 1 },
            end: { x: 130, scale: 1.3, opacity: 0.7 }
        };

        function playAnimation() {
            const box = document.getElementById('targetBox');

            // 초기 위치 설정
            box.style.transform = `translateX(0px) scale(${keyframes.start.scale})`;
            box.style.opacity = keyframes.start.opacity;

            // 딜레이 후 목표 위치로 변형 (애니메이션 효과)
            setTimeout(() => {
                box.style.transform = `translateX(${keyframes.end.x}px) scale(${keyframes.end.scale})`;
                box.style.opacity = keyframes.end.opacity;
            }, 50);
        }

        // [기능 3] 기기 저장 (다운로드 API)
        function saveProjectToDevice() {
            // 저장할 데이터 (나중에 편집 설정값을 JSON 형태로 저장 가능)
            const projectData = {
                version: "1.0",
                animation: keyframes,
                savedAt: new Date().toISOString()
            };

            const dataString = JSON.stringify(projectData, null, 2);
            
            // 가상의 Blob 파일 생성 후 다운로드 링크 연결
            const blob = new Blob([dataString], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'video-edit-project.json'; // 기기에 저장될 파일 이름
            
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
