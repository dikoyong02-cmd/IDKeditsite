<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK Video Editor - Retro Web</title>
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-dark: #808080;
            --win-light: #dfdfdf;
            --win-darker: #404040;
            --win-blue: #000080;
            --win-text: #000000;
        }

        [data-theme="dark"] {
            --win-bg: #2b2b2b;
            --win-dark: #141414;
            --win-light: #424242;
            --win-darker: #000000;
            --win-blue: #1a0033;
            --win-text: #ffccff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 5px;
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', 'Courier New', monospace;
            background-color: #008080;
            color: var(--win-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 윈도우 창 박스 스타일 */
        .window {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), #1084d0);
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-bar-controls button {
            background-color: var(--win-bg);
            color: black;
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-darker);
            border-bottom: 1px solid var(--win-darker);
            width: 16px;
            height: 14px;
            font-size: 9px;
            line-height: 8px;
            padding: 0;
            cursor: pointer;
        }

        .window-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 윈도우 안쪽 오목한 패널 */
        .sunken-panel {
            background-color: white;
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            padding: 8px;
        }

        [data-theme="dark"] .sunken-panel {
            background-color: #1c1c1c;
            color: #ffccff;
        }

        button, input[type="file"], select {
            background-color: var(--win-bg);
            color: var(--win-text);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            padding: 4px 8px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        button:active {
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            padding: 5px 7px 3px 9px;
        }

        .preview-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        #targetBox {
            width: 100px;
            height: 100px;
            background-color: #ff00ff;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            transition: transform 0.3s, opacity 0.3s;
        }

        .control-group {
            margin-bottom: 8px;
            font-size: 11px;
        }

        .control-group label {
            display: block;
            margin-bottom: 3px;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .menu-bar {
            display: flex;
            gap: 10px;
            padding: 2px 4px;
            background-color: var(--win-bg);
            border-bottom: 1px solid var(--win-dark);
            font-size: 11px;
        }

        .menu-item {
            cursor: pointer;
            padding: 1px 4px;
        }
        .menu-item:hover {
            background-color: var(--win-blue);
            color: white;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="window">
        <div class="title-bar">
            <span>IDK_Video_Editor.exe</span>
            <div class="title-bar-controls">
                <button>-</button>
                <button>🗖</button>
                <button>X</button>
            </div>
        </div>

        <div class="menu-bar">
            <div class="menu-item" onclick="toggleTheme()">File(테마전환)</div>
            <div class="menu-item" onclick="saveProjectToDevice()">Save</div>
            <div class="menu-item" onclick="playAutoAnimation()">Test</div>
        </div>

        <div class="window-body">
            <!-- 미디어 업로드 -->
            <div class="sunken-panel">
                <label style="font-size: 11px; font-weight: bold;">Media Source</label>
                <input type="file" id="videoFile" accept="video/*" style="width: 100%; margin-top: 5px;">
                <div id="status" style="font-size: 10px; margin-top: 4px; color: var(--win-text);"></div>
            </div>

            <!-- 미리보기 화면 -->
            <div class="preview-container sunken-panel" style="padding:0;">
                <div id="targetBox">PREVIEW</div>
            </div>
            <div style="font-size: 10px; text-align: center;">00:00 / 00:10 (Keyframe Track)</div>

            <!-- 속성 조절 패널 -->
            <div class="sunken-panel">
                <div style="font-weight: bold; margin-bottom: 6px; font-size: 11px;">Keyframe Properties</div>
                
                <div class="control-group">
                    <label>X Position</label>
                    <input type="range" id="rangeX" min="-100" max="100" value="0" oninput="updateAnimation()">
                </div>

                <div class="control-group">
                    <label>Scale</label>
                    <input type="range" id="rangeScale" min="0.5" max="1.5" step="0.1" value="1" oninput="updateAnimation()">
                </div>

                <div class="control-group">
                    <label>Opacity</label>
                    <input type="range" id="rangeOpacity" min="0.1" max="1" step="0.1" value="1" oninput="updateAnimation()">
                </div>
            </div>

            <!-- 타임라인 -->
            <div class="sunken-panel">
                <div style="font-size: 10px; margin-bottom: 4px;">Timeline Track</div>
                <div style="width: 100%; height: 25px; background-color: var(--win-blue); display: flex; align-items: center; padding-left: 6px; font-size: 10px; color: white;">
                    Video Clip #1
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute("data-theme");
            body.setAttribute("data-theme", currentTheme === "dark" ? "light" : "dark");
        }

        const fileInput = document.getElementById('videoFile');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                status.innerText = `Loaded: ${fileInput.files[0].name}`;
            }
        });

        function updateAnimation() {
            const x = document.getElementById('rangeX').value;
            const scale = document.getElementById('rangeScale').value;
            const opacity = document.getElementById('rangeOpacity').value;
            const box = document.getElementById('targetBox');

            box.style.transform = `translateX(${x}px) scale(${scale})`;
            box.style.opacity = opacity;
        }

        function playAutoAnimation() {
            const box = document.getElementById('targetBox');
            box.style.transform = `translateX(60px) scale(1.2)`;
            box.style.opacity = 0.5;
            document.getElementById('rangeX').value = 60;
            document.getElementById('rangeScale').value = 1.2;
            document.getElementById('rangeOpacity').value = 0.5;

            setTimeout(() => {
                box.style.transform = `translateX(0px) scale(1)`;
                box.style.opacity = 1;
                document.getElementById('rangeX').value = 0;
                document.getElementById('rangeScale').value = 1;
                document.getElementById('rangeOpacity').value = 1;
            }, 800);
        }

        function saveProjectToDevice() {
            const projectData = {
                site: "IDK Editsite",
                theme: document.body.getAttribute("data-theme"),
                settings: {
                    x: document.getElementById('rangeX').value,
                    scale: document.getElementById('rangeScale').value,
                    opacity: document.getElementById('rangeOpacity').value
                },
                savedAt: new Date().toISOString()
            };

            const dataString = JSON.stringify(projectData, null, 2);
            const blob = new Blob([dataString], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'idk-project-save.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
