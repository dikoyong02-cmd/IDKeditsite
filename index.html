<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK Video Editor - Pro Timeline Master</title>
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-dark: #808080;
            --win-light: #dfdfdf;
            --win-darker: #404040;
            --win-blue: #000080;
            --win-text: #000000;
            --panel-inner: #ececec;
            --desktop-bg: #008080;
            --accent: #ff00ff;
        }

        body[data-theme="win95-dark"] {
            --win-bg: #2b2b2b;
            --win-dark: #141414;
            --win-light: #424242;
            --win-darker: #000000;
            --win-blue: #1a0033;
            --win-text: #ffccff;
            --panel-inner: #1c1c1c;
            --desktop-bg: #0b0610;
            --accent: #ff33cc;
        }

        body[data-theme="y2k-pink"] {
            --win-bg: #fff0f5;
            --win-dark: #ffb6c1;
            --win-light: #ffffff;
            --win-darker: #d81b60;
            --win-blue: #c2185b;
            --win-text: #4a1525;
            --panel-inner: #ffe4e1;
            --desktop-bg: #fce4ec;
            --accent: #d81b60;
        }

        body[data-theme="matrix-green"] {
            --win-bg: #0d1117;
            --win-dark: #21262d;
            --win-light: #30363d;
            --win-darker: #000000;
            --win-blue: #238636;
            --win-text: #56d364;
            --panel-inner: #161b22;
            --desktop-bg: #010409;
            --accent: #56d364;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 4px;
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', monospace;
            background-color: var(--desktop-bg);
            color: var(--win-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-menu-bar {
            height: 35px;
            background-color: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-light) var(--win-darker) var(--win-darker) var(--win-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-size: 11px;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .menu-items { display: flex; align-items: center; gap: 8px; }

        button, select, input[type="file"], input[type="text"] {
            background-color: var(--win-bg);
            color: var(--win-text);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            padding: 3px 6px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }
        button:active {
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
        }

        .main-workspace {
            display: grid;
            grid-template-columns: var(--col-1, 240px) 8px 1fr 8px var(--col-3, 260px);
            grid-template-rows: 1fr 8px var(--row-2, 300px);
            flex-grow: 1;
            gap: 0;
            overflow: hidden;
            min-height: 0;
        }

        .resizer-col-1, .resizer-col-3 {
            grid-row: 1 / span 3;
            cursor: ew-resize;
            background: var(--win-dark);
        }
        .resizer-col-1 { grid-column: 2; }
        .resizer-col-3 { grid-column: 4; }
        .resizer-row-2 {
            grid-column: 1 / span 5;
            grid-row: 2;
            cursor: ns-resize;
            background: var(--win-dark);
        }

        .window {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            min-height: 0;
            min-width: 0;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), var(--win-darker));
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            flex-shrink: 0;
        }

        .title-bar-controls button {
            width: 16px; height: 14px; font-size: 9px; line-height: 6px; padding: 0; color: black;
        }

        .sunken-panel {
            background-color: var(--panel-inner);
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            padding: 6px;
            overflow: auto;
            flex-grow: 1;
            min-height: 0;
        }

        .panel-library { grid-column: 1; grid-row: 1; }
        .panel-preview { grid-column: 3; grid-row: 1; }
        .panel-inspector { grid-column: 5; grid-row: 1 / span 3; }
        .panel-timeline { grid-column: 1 / span 3; grid-row: 3; }

        .panel-preview .sunken-panel { display: flex; flex-direction: column; padding: 0; }
        .preview-container {
            width: 100%; flex: 1 1 auto; min-height: 0;
            display: flex; align-items: center; justify-content: center;
            background-color: #000; position: relative; overflow: hidden;
        }

        #videoElement, #targetBox, #textOverlayElement {
            max-width: 100%; max-height: 100%; position: absolute; object-fit: contain;
        }
        #textOverlayElement {
            font-size: 24px; font-weight: bold; color: white; text-shadow: 2px 2px black; pointer-events: none; display: none; z-index: 5;
        }

        .playback-bar {
            flex-shrink: 0; width: 100%; background: var(--win-bg); padding: 6px;
            display: flex; align-items: center; justify-content: center; gap: 6px; border-top: 2px solid var(--win-darker);
        }
        .playback-bar button { font-size: 13px; font-weight: bold; width: 32px; height: 28px; padding: 0; }
        #playBtn { background-color: var(--win-blue) !important; color: white !important; width: 40px; }

        .control-group { margin-bottom: 8px; font-size: 11px; }
        .control-group label { display: block; margin-bottom: 3px; }
        .control-group input[type="range"] { width: 100%; }

        .file-list-box {
            background: var(--win-darker); border: 1px solid var(--win-light); height: 70px;
            margin-top: 4px; overflow-y: auto; color: white; font-size: 10px; padding: 4px;
        }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 3px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent;
        }
        .file-item:hover { background-color: rgba(255,255,255,0.1); }
        .file-item.selected { background-color: var(--win-blue); border-color: white; }

        .panel-timeline .sunken-panel { display: flex; flex-direction: column; gap: 4px; }
        .timeline-tools-bar { display: flex; gap: 4px; margin-bottom: 2px; align-items: center; flex-wrap: wrap; }
        .timeline-tools-bar button { font-size: 10px; padding: 2px 6px; }

        .timeline-ruler {
            position: relative; height: 20px; border-bottom: 1px solid var(--win-dark);
            font-size: 9px; flex-shrink: 0; overflow: hidden; background: rgba(0,0,0,0.1);
        }
        .ruler-tick { position: absolute; top: 0; border-left: 1px solid var(--win-dark); padding-left: 2px; height: 100%; }

        .timeline-tracks-container {
            display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto;
            min-height: 145px; background-color: var(--win-darker); border: 1px solid var(--win-light);
            overflow-y: auto; position: relative;
        }
        .timeline-track {
            position: relative; width: 100%; height: 42px;
            background-color: rgba(0,0,0,0.2); border-bottom: 1px solid var(--win-dark);
        }
        .timeline-track::before {
            content: attr(data-track-name); position: absolute; left: 4px; top: 2px;
            font-size: 9px; color: #aaa; z-index: 5; pointer-events: none;
        }

        #playheadLine {
            position: absolute; top: 0; left: 0; width: 2px; height: 100%;
            background: red; z-index: 20; pointer-events: none;
        }
        .timeline-clip {
            position: absolute; top: 14px; height: 24px; background-color: var(--win-blue);
            border: 1.5px solid white; display: flex; align-items: center; justify-content: space-between;
            padding: 0 6px; font-size: 10px; font-weight: bold; color: white; white-space: nowrap;
            overflow: hidden; z-index: 10; cursor: pointer; border-radius: 2px;
        }
        .timeline-clip.selected { border-color: var(--accent); box-shadow: 0 0 4px var(--accent); }
        .clip-handle {
            width: 6px; height: 100%; background: rgba(255,255,255,0.7); position: absolute; cursor: ew-resize; top: 0; z-index: 12;
        }
        .clip-handle.left { left: 0; }
        .clip-handle.right { right: 0; }
    </style>
</head>
<body data-theme="win95-dark" id="mainBody">

    <div class="top-menu-bar">
        <div class="menu-items">
            <span style="font-weight: bold; color: var(--win-blue);">IDK-EDITSITE</span>
            <label>테마:</label>
            <select id="themeSelector" onchange="changeTheme(this.value)">
                <option value="win95-dark">클래식 윈도우 다크</option>
                <option value="y2k-pink">Y2K 핑크 고딕</option>
                <option value="matrix-green">매트릭스 힙합</option>
            </select>
            <button onclick="saveProject()">프로젝트 저장</button>
        </div>
        <div style="font-size: 10px;">Pro v2.2</div>
    </div>

    <div class="main-workspace" id="workspace">
        <!-- Media Library -->
        <div class="window panel-library">
            <div class="title-bar"><span>Media & Text Source</span><div class="title-bar-controls"><button>-</button></div></div>
            <div class="sunken-panel">
                <label style="font-weight: bold;">비디오 파일 업로드</label>
                <input type="file" id="videoFile" accept="video/*" style="width: 100%; margin-top: 4px;">
                
                <label style="font-weight: bold; margin-top: 6px; display: block;">텍스트 추가</label>
                <div style="display: flex; gap: 4px; margin-top: 2px;">
                    <input type="text" id="textInput" placeholder="자막 내용 입력" style="flex:1;">
                    <button onclick="addTextSource()">추가</button>
                </div>

                <label style="font-weight: bold; margin-top: 6px; display: block;">소스 목록</label>
                <div class="file-list-box" id="fileListBox">
                    <div style="color: #888; text-align: center; padding-top: 15px;">소스 없음</div>
                </div>
                <button onclick="deleteSelectedSource()" style="width: 100%; margin-top: 4px; background-color: #5a1a1a; color: white;">🗑 소스 삭제</button>
            </div>
        </div>

        <div class="resizer-col-1" id="resizer1"></div>

        <!-- Preview Window -->
        <div class="window panel-preview">
            <div class="title-bar"><span>Preview Window</span><div class="title-bar-controls"><button>-</button></div></div>
            <div class="sunken-panel">
                <div class="preview-container" id="previewContainer">
                    <video id="videoElement"></video>
                    <div id="textOverlayElement"></div>
                    <div id="targetBox"></div>
                </div>
                <div class="playback-bar">
                    <button onclick="seekRelative(-5)">⏮</button>
                    <button id="playBtn" onclick="togglePlay()">▶</button>
                    <button onclick="stopPlayback()">⏹</button>
                    <button onclick="seekRelative(5)">⏭</button>
                    <span id="timeDisplay" style="font-size:11px; margin-left:6px;">00:0.0s / 30.0s</span>
                </div>
            </div>
        </div>

        <div class="resizer-col-3" id="resizer2"></div>

        <!-- Inspector -->
        <div class="window panel-inspector">
            <div class="title-bar"><span>Properties</span><div class="title-bar-controls"><button>-</button></div></div>
            <div class="sunken-panel">
                <div class="control-group">
                    <label>X Position (<span id="valX">0</span>px)</label>
                    <input type="range" id="rangeX" min="-150" max="150" value="0" oninput="updateProperties()">
                </div>
                <div class="control-group">
                    <label>Scale (<span id="valScale">1.0</span>)</label>
                    <input type="range" id="rangeScale" min="0.2" max="2.0" step="0.1" value="1" oninput="updateProperties()">
                </div>
                <div class="control-group">
                    <label>Opacity (<span id="valOpacity">1.0</span>)</label>
                    <input type="range" id="rangeOpacity" min="0.1" max="1.0" step="0.1" value="1" oninput="updateProperties()">
                </div>
            </div>
        </div>

        <div class="resizer-row-2" id="resizer3"></div>

        <!-- Timeline -->
        <div class="window panel-timeline">
            <div class="title-bar"><span>Timeline Editor</span><div class="title-bar-controls"><button>-</button></div></div>
            <div class="sunken-panel">
                <div class="timeline-tools-bar">
                    <button onclick="splitSelectedClip()">✂️ 자르기</button>
                    <button onclick="copySelectedClip()">📋 복사</button>
                    <button onclick="pasteClip()">📌 붙여넣기</button>
                    <button onclick="deleteSelectedClip()" style="background-color: #5a1a1a; color: white;">🗑 삭제</button>
                    <button onclick="moveClipTrack(-1)">▲ 위로</button>
                    <button onclick="moveClipTrack(1)">▼ 아래로</button>
                    <span style="font-size:10px; margin-left: auto;">확대/축소:</span>
                    <input type="range" id="zoomRange" min="10" max="60" value="30" style="width: 80px;" oninput="renderAll()">
                </div>
                <div class="timeline-ruler" id="timelineRuler"></div>
                <div class="timeline-tracks-container" id="timelineTracksContainer" onclick="seekTimeline(event)">
                    <div id="playheadLine"></div>
                    <div class="timeline-track" data-track-id="0" data-track-name="Track 1 (Video/Text)"></div>
                    <div class="timeline-track" data-track-id="1" data-track-name="Track 2"></div>
                    <div class="timeline-track" data-track-id="2" data-track-name="Track 3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeTheme(themeName) {
            document.getElementById('mainBody').setAttribute('data-theme', themeName);
        }

        const workspace = document.getElementById('workspace');
        let isResizing = null;
        document.getElementById('resizer1').onmousedown = () => isResizing = 'col1';
        document.getElementById('resizer2').onmousedown = () => isResizing = 'col3';
        document.getElementById('resizer3').onmousedown = () => isResizing = 'row2';
        window.onmousemove = (e) => {
            if (!isResizing) return;
            const rect = workspace.getBoundingClientRect();
            if (isResizing === 'col1') workspace.style.setProperty('--col-1', (e.clientX - rect.left) + 'px');
            if (isResizing === 'col3') workspace.style.setProperty('--col-3', (rect.right - e.clientX) + 'px');
            if (isResizing === 'row2') workspace.style.setProperty('--row-2', (rect.bottom - e.clientY) + 'px');
        };
        window.onmouseup = () => isResizing = null;

        let sources = []; 
        let timelineClips = []; 
        let selectedSourceIndex = null;
        let selectedClipId = null;
        let copiedClipData = null;

        const videoElement = document.getElementById('videoElement');
        const textOverlayElement = document.getElementById('textOverlayElement');
        const fileListBox = document.getElementById('fileListBox');
        const timelineTracksContainer = document.getElementById('timelineTracksContainer');
        const playheadLine = document.getElementById('playheadLine');
        const timeDisplay = document.getElementById('timeDisplay');

        // 파일 업로드
        document.getElementById('videoFile').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const tempVid = document.createElement('video');
            tempVid.src = url;
            tempVid.onloadedmetadata = () => {
                const newSource = {
                    id: 'src_' + Date.now(),
                    type: 'video',
                    name: file.name,
                    url: url,
                    duration: tempVid.duration || 10
                };
                sources.push(newSource);
                timelineClips.push({
                    id: 'clip_' + Date.now(),
                    sourceId: newSource.id,
                    name: newSource.name,
                    type: 'video',
                    track: 0,
                    start: 0,
                    duration: Math.min(newSource.duration, 10),
                    url: url
                });
                renderAll();
            };
        };

        // 텍스트 소스 추가
        function addTextSource() {
            const txt = document.getElementById('textInput').value.trim();
            if (!txt) return;
            const newSource = {
                id: 'src_' + Date.now(),
                type: 'text',
                name: txt,
                duration: 5
            };
            sources.push(newSource);
            timelineClips.push({
                id: 'clip_' + Date.now(),
                sourceId: newSource.id,
                name: txt,
                type: 'text',
                track: 0,
                start: 0,
                duration: 5
            });
            document.getElementById('textInput').value = '';
            renderAll();
        }

        function getMaxDuration() {
            let max = 20;
            timelineClips.forEach(c => {
                if (c.start + c.duration > max) max = c.start + c.duration;
            });
            return max + 5;
        }

        function renderAll() {
            renderFileList();
            renderTracks();
            renderRuler();
        }

        function renderFileList() {
            fileListBox.innerHTML = '';
            if (sources.length === 0) {
                fileListBox.innerHTML = '<div style="color: #888; text-align: center; padding-top: 15px;">소스 없음</div>';
                return;
            }
            sources.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = `file-item ${selectedSourceIndex === idx ? 'selected' : ''}`;
                item.innerHTML = `<span>${s.type === 'video' ? '🎬' : '💬'} ${s.name}</span>`;
                item.onclick = () => { selectedSourceIndex = idx; renderFileList(); };
                fileListBox.appendChild(item);
            });
        }

        function renderTracks() {
            const existingClips = timelineTracksContainer.querySelectorAll('.timeline-clip');
            existingClips.forEach(el => el.remove());

            const maxDur = getMaxDuration();
            const zoomFactor = parseFloat(document.getElementById('zoomRange').value) || 30; // 초당 픽셀 또는 비율 가중치

            timelineClips.tracksContainerWidth = maxDur * zoomFactor;
            timelineTracksContainer.style.width = Math.max(timelineTracksContainer.clientWidth, timelineClips.tracksContainerWidth) + 'px';

            timelineClips.forEach(clip => {
                const trackEl = timelineTracksContainer.querySelector(`[data-track-id="${clip.track}"]`);
                if (!trackEl) return;

                const clipEl = document.createElement('div');
                clipEl.className = `timeline-clip ${selectedClipId === clip.id ? 'selected' : ''}`;
                
                const leftPx = clip.start * zoomFactor;
                const widthPx = clip.duration * zoomFactor;

                clipEl.style.left = `${leftPx}px`;
                clipEl.style.width = `${widthPx}px`;
                clipEl.innerHTML = `<span>${clip.name}</span>`;
                
                clipEl.onclick = (e) => {
                    e.stopPropagation();
                    selectedClipId = clip.id;
                    renderTracks();
                };

                // 좌우 크기 조절 핸들 (늘리기/줄이기)
                const leftHandle = document.createElement('div');
                leftHandle.className = 'clip-handle left';
                leftHandle.onmousedown = (e) => initResizeClip(e, clip, 'left', zoomFactor);

                const rightHandle = document.createElement('div');
                rightHandle.className = 'clip-handle right';
                rightHandle.onmousedown = (e) => initResizeClip(e, clip, 'right', zoomFactor);

                // 드래그하여 좌우 파일 이동 기능
                clipEl.onmousedown = (e) => {
                    if (e.target.classList.contains('clip-handle')) return;
                    initMoveClipX(e, clip, zoomFactor);
                };

                clipEl.appendChild(leftHandle);
                clipEl.appendChild(rightHandle);
                trackEl.appendChild(clipEl);
            });
        }

        // 파일 늘리기 / 줄이기 (Trim)
        function initResizeClip(e, clip, direction, zoomFactor) {
            e.stopPropagation();
            const startX = e.clientX;
            const initialStart = clip.start;
            const initialDuration = clip.duration;

            function onMouseMove(moveEvent) {
                const deltaX = moveEvent.clientX - startX;
                const deltaTime = deltaX / zoomFactor;

                if (direction === 'right') {
                    let newDur = initialDuration + deltaTime;
                    if (newDur >= 0.5) clip.duration = newDur;
                } else if (direction === 'left') {
                    let newStart = initialStart + deltaTime;
                    let newDur = initialDuration - deltaTime;
                    if (newStart >= 0 && newDur >= 0.5) {
                        clip.start = newStart;
                        clip.duration = newDur;
                    }
                }
                renderTracks();
                renderRuler();
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            }
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        // 파일 좌우 이동 (드래그)
        function initMoveClipX(e, clip, zoomFactor) {
            selectedClipId = clip.id;
            renderTracks();
            const startX = e.clientX;
            const initialStart = clip.start;

            function onMouseMove(moveEvent) {
                const deltaX = moveEvent.clientX - startX;
                const deltaTime = deltaX / zoomFactor;
                let newStart = initialStart + deltaTime;
                if (newStart < 0) newStart = 0;
                clip.start = newStart;
                renderTracks();
                renderRuler();
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            }
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        // 파일 위/아래 트랙 이동 (위, 아래 버튼)
        function moveClipTrack(direction) {
            if (!selectedClipId) {
                alert('이동할 클립을 선택해주세요.');
                return;
            }
            const clip = timelineClips.find(c => c.id === selectedClipId);
            if (!clip) return;
            
            let newTrack = clip.track + direction;
            if (newTrack >= 0 && newTrack <= 2) {
                clip.track = newTrack;
                renderTracks();
            }
        }

        // 파일 자르기 (Split)
        function splitSelectedClip() {
            if (!selectedClipId) {
                alert('자를 클립을 선택해주세요.');
                return;
            }
            const clip = timelineClips.find(c => c.id === selectedClipId);
            const currentTime = videoElement.currentTime || 2;

            if (currentTime > clip.start && currentTime < clip.start + clip.duration) {
                const firstDuration = currentTime - clip.start;
                const secondDuration = clip.duration - firstDuration;
                clip.duration = firstDuration;

                const newClip = {
                    id: 'clip_' + Date.now(),
                    sourceId: clip.sourceId,
                    name: clip.name + ' (잘림)',
                    type: clip.type,
                    track: clip.track,
                    start: currentTime,
                    duration: secondDuration,
                    url: clip.url
                };
                timelineClips.push(newClip);
                renderTracks();
            } else {
                alert('플레이헤드 선이 선택한 클립 구간 안에 위치해야 합니다.');
            }
        }

        // 파일 삭제
        function deleteSelectedClip() {
            if (!selectedClipId) {
                alert('삭제할 클립을 선택해주세요.');
                return;
            }
            timelineClips = timelineClips.filter(c => c.id !== selectedClipId);
            selectedClipId = null;
            renderAll();
        }

        // 복사 & 붙여넣기
        function copySelectedClip() {
            if (!selectedClipId) {
                alert('복사할 클립을 선택해주세요.');
                return;
            }
            const clip = timelineClips.find(c => c.id === selectedClipId);
            copiedClipData = JSON.parse(JSON.stringify(clip));
            alert('클립이 복사되었습니다.');
        }

        function pasteClip() {
            if (!copiedClipData) {
                alert('복사된 클립이 없습니다.');
                return;
            }
            const newClip = {
                ...copiedClipData,
                id: 'clip_' + Date.now(),
                start: copiedClipData.start + copiedClipData.duration + 0.5
            };
            timelineClips.push(newClip);
            selectedClipId = newClip.id;
            renderAll();
        }

        function deleteSelectedSource() {
            if (selectedSourceIndex === null) return;
            sources.splice(selectedSourceIndex, 1);
            selectedSourceIndex = null;
            renderAll();
        }

        function renderRuler() {
            const ruler = document.getElementById('timelineRuler');
            ruler.innerHTML = '';
            const maxDur = getMaxDuration();
            for (let t = 0; t <= maxDur; t += 5) {
                const tick = document.createElement('div');
                tick.className = 'ruler-tick';
                const zoomFactor = parseFloat(document.getElementById('zoomRange').value) || 30;
                tick.style.left = (t * zoomFactor) + 'px';
                tick.innerText = `${t}s`;
                ruler.appendChild(tick);
            }
        }

        function seekTimeline(event) {
            const rect = timelineTracksContainer.getBoundingClientRect();
            const clickX = Math.max(0, event.clientX - rect.left);
            const zoomFactor = parseFloat(document.getElementById('zoomRange').value) || 30;
            const targetTime = clickX / zoomFactor;

            if (videoElement.src) {
                videoElement.currentTime = targetTime;
            }
            playheadLine.style.left = clickX + 'px';
        }

        videoElement.ontimeupdate = () => {
            const zoomFactor = parseFloat(document.getElementById('zoomRange').value) || 30;
            const leftPx = videoElement.currentTime * zoomFactor;
            playheadLine.style.left = leftPx + 'px';
            timeDisplay.innerText = `${videoElement.currentTime.toFixed(1)}s / 30.0s`;

            // 재생 중 텍스트 클립 및 비디오 감지 반영
            const activeClip = timelineClips.find(c => videoElement.currentTime >= c.start && videoElement.currentTime <= c.start + c.duration);
            if (activeClip && activeClip.type === 'text') {
                textOverlayElement.style.display = 'block';
                textOverlayElement.innerText = activeClip.name;
            } else {
                textOverlayElement.style.display = 'none';
            }
        };

        function togglePlay() {
            if (videoElement.paused && videoElement.src) {
                videoElement.play();
                document.getElementById('playBtn').innerText = "❚❚";
            } else {
                videoElement.pause();
                document.getElementById('playBtn').innerText = "▶";
            }
        }

        function stopPlayback() {
            videoElement.pause();
            videoElement.currentTime = 0;
            document.getElementById('playBtn').innerText = "▶";
        }

        function seekRelative(sec) {
            if (videoElement.src) videoElement.currentTime += sec;
        }

        function updateProperties() {
            const x = document.getElementById('rangeX').value;
            const scale = document.getElementById('rangeScale').value;
            const opacity = document.getElementById('rangeOpacity').value;

            document.getElementById('valX').innerText = x;
            document.getElementById('valScale').innerText = scale;
            document.getElementById('valOpacity').innerText = opacity;

            videoElement.style.transform = `translate(${x}px, 0px) scale(${scale})`;
            videoElement.style.opacity = opacity;
            textOverlayElement.style.transform = `translate(${x}px, 0px) scale(${scale})`;
        }

        function saveProject() {
            alert('프로젝트가 성공적으로 저장되었습니다!');
        }

        // 키보드 단축키 지원 (Delete로 삭제)
        window.onkeydown = (e) => {
            if (e.key === 'Delete' && selectedClipId) {
                deleteSelectedClip();
            }
        };

        renderRuler();
    </script>
</body>
</html>
