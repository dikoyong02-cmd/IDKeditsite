<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK Video Editor - Filmora Y2K Retro</title>
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-dark: #808080;
            --win-light: #dfdfdf;
            --win-darker: #404040;
            --win-blue: #000080;
            --win-text: #000000;
            --panel-inner: #ececec;
        }

        [data-theme="dark"] {
            --win-bg: #2b2b2b;
            --win-dark: #141414;
            --win-light: #424242;
            --win-darker: #000000;
            --win-blue: #1a0033;
            --win-text: #ffccff;
            --panel-inner: #1c1c1c;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 4px;
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', 'Courier New', monospace;
            background-color: var(--win-bg);
            color: var(--win-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* 윈도우 창 공통 스타일 */
        .window {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), #1084d0);
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-bar-controls button {
            background-color: var(--win-bg);
            color: black;
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-darker);
            border-bottom: 1px solid var(--win-darker);
            width: 14px;
            height: 12px;
            font-size: 8px;
            line-height: 6px;
            padding: 0;
            cursor: pointer;
        }

        .sunken-panel {
            background-color: var(--panel-inner);
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            padding: 6px;
            overflow: auto;
        }

        /* 필모라 스타일 상단 메뉴바 */
        .top-menu-bar {
            height: 35px;
            background-color: var(--win-bg);
            border-bottom: 2px solid var(--win-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-size: 11px;
            flex-shrink: 0;
        }
        .menu-items {
            display: flex;
            gap: 12px;
        }
        .menu-btn {
            background: none;
            border: none;
            color: var(--win-text);
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            padding: 2px 5px;
        }
        .menu-btn:hover {
            background-color: var(--win-blue);
            color: white;
        }

        /* 메인 레이아웃 구조 (필모라 배치) */
        .main-layout {
            display: grid;
            grid-template-columns: 240px 1fr 260px;
            grid-template-rows: 1fr 140px;
            flex-grow: 1;
            gap: 4px;
            margin-top: 4px;
            overflow: hidden;
        }

        /* 1. 미디어/소스 라이브러리 (좌측 상단) */
        .panel-library {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 2. 미리보기 창 (중앙 상단) */
        .panel-preview {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #targetBox {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, var(--win-blue), #ff00ff);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            transition: transform 0.3s, opacity 0.3s;
        }

        /* 3. 인스펙터 / 속성 패널 (우측) */
        .panel-inspector {
            grid-column: 3;
            grid-row: 1 / span 2;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 4. 타임라인 영역 (하단) */
        .panel-timeline {
            grid-column: 1 / span 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
        }

        button, input[type="file"] {
            background-color: var(--win-bg);
            color: var(--win-text);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            padding: 4px 8px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }
        button:active {
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
        }

        .control-group {
            margin-bottom: 8px;
            font-size: 11px;
        }
        .control-group label {
            display: block;
            margin-bottom: 3px;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- 상단 메뉴바 (필모라 스타일 배치) -->
    <div class="top-menu-bar">
        <div class="menu-items">
            <span style="font-weight: bold; color: var(--win-blue);">IDK-EDITSITE</span>
            <button class="menu-btn" onclick="toggleTheme()">테마전환</button>
            <button class="menu-btn" onclick="saveProjectToDevice()">프로젝트저장</button>
        </div>
        <div>미디어 편집기 v1.0</div>
    </div>

    <div class="main-layout">

        <!-- 1. 미디어 라이브러리 패널 -->
        <div class="window panel-library">
            <div class="title-bar">
                <span>Media Source</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel" style="flex-grow: 1;">
                <label style="font-weight: bold; font-size: 11px;">비디오 파일 업로드</label>
                <input type="file" id="videoFile" accept="video/*" style="width: 100%; margin-top: 6px;">
                <div id="status" style="font-size: 10px; margin-top: 6px; color: var(--win-text);"></div>
            </div>
        </div>

        <!-- 2. 프리뷰 패널 -->
        <div class="window panel-preview">
            <div class="title-bar" style="width: 100%;">
                <span>Preview Window</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel" style="width: 100%; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div id="targetBox">PREVIEW</div>
                <div style="font-size: 10px; margin-top: 10px;">00:00 / 00:10 (Keyframe Track)</div>
            </div>
        </div>

        <!-- 3. 인스펙터 속성 조절 패널 -->
        <div class="window panel-inspector">
            <div class="title-bar">
                <span>Keyframe Properties</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel" style="flex-grow: 1;">
                <div class="control-group">
                    <label>X Position</label>
                    <input type="range" id="rangeX" min="-90" max="90" value="0" oninput="updateAnimation()">
                </div>
                <div class="control-group">
                    <label>Scale</label>
                    <input type="range" id="rangeScale" min="0.5" max="1.5" step="0.1" value="1" oninput="updateAnimation()">
                </div>
                <div class="control-group">
                    <label>Opacity</label>
                    <input type="range" id="rangeOpacity" min="0.2" max="1" step="0.1" value="1" oninput="updateAnimation()">
                </div>
                <button onclick="playAutoAnimation()" style="width: 100%; margin-top: 10px;">애니메이션 테스트</button>
            </div>
        </div>

        <!-- 4. 타임라인 패널 -->
        <div class="window panel-timeline">
            <div class="title-bar">
                <span>Timeline Track</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel" style="flex-grow: 1; display: flex; align-items: center;">
                <div style="width: 100%; height: 26px; background-color: var(--win-blue); display: flex; align-items: center; padding-left: 8px; font-size: 10px; color: white; border: 1px solid white;">
                    Video Clip #1 (Track 1)
                </div>
            </div>
        </div>

    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute("data-theme");
            body.setAttribute("data-theme", currentTheme === "dark" ? "light" : "dark");
        }

        const fileInput = document.getElementById('videoFile');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                status.innerText = `Loaded: ${fileInput.files[0].name}`;
            }
        });

        function updateAnimation() {
            const x = document.getElementById('rangeX').value;
            const scale = document.getElementById('rangeScale').value;
            const opacity = document.getElementById('rangeOpacity').value;
            const box = document.getElementById('targetBox');

            box.style.transform = `translateX(${x}px) scale(${scale})`;
            box.style.opacity = opacity;
        }

        function playAutoAnimation() {
            const box = document.getElementById('targetBox');
            box.style.transform = `translateX(50px) scale(1.3)`;
            box.style.opacity = 0.5;
            document.getElementById('rangeX').value = 50;
            document.getElementById('rangeScale').value = 1.3;
            document.getElementById('rangeOpacity').value = 0.5;

            setTimeout(() => {
                box.style.transform = `translateX(0px) scale(1)`;
                box.style.opacity = 1;
                document.getElementById('rangeX').value = 0;
                document.getElementById('rangeScale').value = 1;
                document.getElementById('rangeOpacity').value = 1;
            }, 800);
        }

        function saveProjectToDevice() {
            const projectData = {
                site: "IDK Editsite",
                theme: document.body.getAttribute("data-theme"),
                settings: {
                    x: document.getElementById('rangeX').value,
                    scale: document.getElementById('rangeScale').value,
                    opacity: document.getElementById('rangeOpacity').value
                },
                savedAt: new Date().toISOString()
            };

            const dataString = JSON.stringify(projectData, null, 2);
            const blob = new Blob([dataString], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'idk-project-save.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
