<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK Video Editor - Real Video & Keyframe Editor</title>
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-dark: #808080;
            --win-light: #dfdfdf;
            --win-darker: #404040;
            --win-blue: #000080;
            --win-text: #000000;
            --panel-inner: #ececec;
            --desktop-bg: #008080;
            --accent: #ff00ff;
        }

        body[data-theme="win95-dark"] {
            --win-bg: #2b2b2b;
            --win-dark: #141414;
            --win-light: #424242;
            --win-darker: #000000;
            --win-blue: #1a0033;
            --win-text: #ffccff;
            --panel-inner: #1c1c1c;
            --desktop-bg: #0b0610;
            --accent: #ff33cc;
        }

        body[data-theme="y2k-pink"] {
            --win-bg: #fff0f5;
            --win-dark: #ffb6c1;
            --win-light: #ffffff;
            --win-darker: #d81b60;
            --win-blue: #c2185b;
            --win-text: #4a1525;
            --panel-inner: #ffe4e1;
            --desktop-bg: #fce4ec;
            --accent: #d81b60;
        }

        body[data-theme="matrix-green"] {
            --win-bg: #0d1117;
            --win-dark: #21262d;
            --win-light: #30363d;
            --win-darker: #000000;
            --win-blue: #238636;
            --win-text: #56d364;
            --panel-inner: #161b22;
            --desktop-bg: #010409;
            --accent: #56d364;
        }

        body[data-theme="retro-orange"] {
            --win-bg: #2d231e;
            --win-dark: #1a1411;
            --win-light: #4a3b32;
            --win-darker: #0d0a08;
            --win-blue: #d97706;
            --win-text: #fde68a;
            --panel-inner: #1f1815;
            --desktop-bg: #1c1410;
            --accent: #d97706;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 4px;
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', 'Courier New', monospace;
            background-color: var(--desktop-bg);
            color: var(--win-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-menu-bar {
            height: 35px;
            background-color: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-light) var(--win-darker) var(--win-darker) var(--win-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-size: 11px;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .menu-items {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button, select, input[type="file"] {
            background-color: var(--win-bg);
            color: var(--win-text);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            padding: 3px 6px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }
        button:active {
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
        }

        /* 메인 워크스페이스 그리드 (타임라인 기본 높이 300px로 대폭 확장) */
        .main-workspace {
            display: grid;
            grid-template-columns: var(--col-1, 240px) 8px 1fr 8px var(--col-3, 260px);
            grid-template-rows: 1fr 8px var(--row-2, 300px);
            flex-grow: 1;
            gap: 0;
            overflow: hidden;
            min-height: 0;
        }

        .resizer-col-1, .resizer-col-3 {
            grid-row: 1 / span 3;
            cursor: ew-resize;
            background: var(--win-dark);
            background-image: repeating-linear-gradient(180deg, var(--win-light) 0 2px, transparent 2px 6px);
            background-position: center;
            background-repeat: repeat-y;
            background-size: 2px 6px;
        }
        .resizer-col-1 { grid-column: 2; }
        .resizer-col-3 { grid-column: 4; }
        .resizer-row-2 {
            grid-column: 1 / span 5;
            grid-row: 2;
            cursor: ns-resize;
            background: var(--win-dark);
            background-image: repeating-linear-gradient(90deg, var(--win-light) 0 2px, transparent 2px 6px);
            background-position: center;
            background-repeat: repeat-x;
            background-size: 6px 2px;
        }
        .resizer-col-1:hover, .resizer-col-3:hover, .resizer-row-2:hover,
        .resizer-col-1.active, .resizer-col-3.active, .resizer-row-2.active {
            background-color: var(--accent);
        }

        .window {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            min-height: 0;
            min-width: 0;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), var(--win-darker));
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            flex-shrink: 0;
        }

        .title-bar-controls button {
            background-color: var(--win-bg);
            color: black;
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-darker);
            border-bottom: 1px solid var(--win-darker);
            width: 16px;
            height: 14px;
            font-size: 9px;
            line-height: 6px;
            padding: 0;
            cursor: pointer;
        }

        .sunken-panel {
            background-color: var(--panel-inner);
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            padding: 6px;
            overflow: auto;
            flex-grow: 1;
            min-height: 0;
        }

        .window.collapsed .sunken-panel { display: none; }

        .panel-library { grid-column: 1; grid-row: 1; }
        .panel-preview { grid-column: 3; grid-row: 1; }
        .panel-inspector { grid-column: 5; grid-row: 1 / span 3; }
        .panel-timeline { grid-column: 1 / span 3; grid-row: 3; }

        .panel-preview .sunken-panel {
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .preview-container {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        #videoElement, #targetBox {
            max-width: 100%;
            max-height: 100%;
            position: absolute;
            object-fit: contain;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
        }

        #targetBox {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--win-blue), var(--win-darker));
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        .playback-bar {
            flex-shrink: 0;
            width: 100%;
            background: var(--win-bg);
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 2px solid var(--win-darker);
        }
        .playback-bar button {
            font-size: 15px;
            font-weight: bold;
            width: 34px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #playBtn {
            background-color: var(--win-blue) !important;
            color: white !important;
            width: 44px;
        }
        #timeDisplay {
            font-size: 11px;
            margin-left: 8px;
            min-width: 100px;
        }

        .control-group {
            margin-bottom: 8px;
            font-size: 11px;
        }
        .control-group label {
            display: block;
            margin-bottom: 3px;
        }
        .control-group input[type="range"] {
            width: 100%;
        }

        /* 미디어 파일 목록 박스 스타일 */
        .file-list-box {
            background: var(--win-darker);
            border: 1px solid var(--win-light);
            height: 100px;
            margin-top: 6px;
            overflow-y: auto;
            color: white;
            font-size: 10px;
            padding: 4px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px;
            cursor: pointer;
            margin-bottom: 2px;
            border: 1px solid transparent;
        }
        .file-item:hover {
            background-color: rgba(255,255,255,0.1);
        }
        .file-item.selected {
            background-color: var(--win-blue);
            border-color: white;
        }

        /* 타임라인 패널 (높이 확장 완료) */
        .panel-timeline .sunken-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        .timeline-ruler {
            position: relative;
            height: 22px;
            border-bottom: 1px solid var(--win-dark);
            font-size: 10px;
            flex-shrink: 0;
        }
        .ruler-tick {
            position: absolute;
            top: 0;
            border-left: 1px solid var(--win-dark);
            padding-left: 2px;
            height: 100%;
            white-space: nowrap;
        }

        .timeline-track-area {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 160px; /* 타임라인 칸 대폭 확장 */
            background-color: var(--win-darker);
            border: 1px solid var(--win-light);
            cursor: pointer;
        }
        .keyframe-marker {
            position: absolute;
            top: 2px;
            width: 10px;
            height: calc(100% - 4px);
            background-color: var(--accent);
            border: 1px solid white;
            transform: translateX(-50%);
            cursor: grab;
            z-index: 3;
        }
        .keyframe-marker::after {
            content: '';
            position: absolute;
            top: 0; left: 3px;
            width: 2px; height: 100%;
            background: white;
        }
        #playheadLine {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: red;
            z-index: 4;
            pointer-events: none;
        }
        .timeline-clip {
            position: absolute;
            top: 6px;
            height: calc(100% - 12px);
            background-color: var(--win-blue);
            border: 1px solid white;
            opacity: 0.8;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 11px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            z-index: 2;
        }
    </style>
</head>
<body data-theme="win95-dark" id="mainBody">

    <!-- 상단 메뉴바 -->
    <div class="top-menu-bar">
        <div class="menu-items">
            <span style="font-weight: bold; color: var(--win-blue);">IDK-EDITSITE</span>
            <label style="font-size:11px;">테마:</label>
            <select id="themeSelector" onchange="changeTheme(this.value)">
                <option value="win95-dark">클래식 윈도우 다크</option>
                <option value="y2k-pink">Y2K 핑크 고딕</option>
                <option value="matrix-green">매트릭스 힙합</option>
                <option value="retro-orange">레트로 오렌지</option>
            </select>
            <button onclick="resetLayout()">창 크기/위치 초기화</button>
            <button onclick="saveProjectToDevice()">프로젝트 저장</button>
        </div>
        <div style="font-size: 10px;">Full Editor v2.9</div>
    </div>

    <!-- 메인 워크스페이스 -->
    <div class="main-workspace" id="workspace">

        <!-- 1. 미디어 라이브러리 패널 -->
        <div class="window panel-library">
            <div class="title-bar">
                <span>Media Source</span>
                <div class="title-bar-controls"><button onclick="toggleCollapse(this)">-</button></div>
            </div>
            <div class="sunken-panel">
                <label style="font-weight: bold; font-size: 11px;">비디오 파일 업로드</label>
                <input type="file" id="videoFile" accept="video/*" style="width: 100%; margin-top: 6px;">
                
                <label style="font-weight: bold; font-size: 11px; margin-top: 8px; display: block;">업로드된 파일 목록 (선택 삭제 가능)</label>
                <div class="file-list-box" id="fileListBox">
                    <div style="color: #888; text-align: center; padding-top: 30px;">업로드된 파일 없음</div>
                </div>

                <button onclick="deleteSelectedFile()" style="width: 100%; margin-top: 6px; background-color: #5a1a1a; color: white;">🗑 선택한 파일 삭제</button>
                <div id="status" style="font-size: 10px; margin-top: 4px;"></div>
            </div>
        </div>

        <div class="resizer-col-1" id="resizer1"></div>

        <!-- 2. 프리뷰 패널 -->
        <div class="window panel-preview">
            <div class="title-bar">
                <span>Preview Window</span>
                <div class="title-bar-controls"><button onclick="toggleCollapse(this)">-</button></div>
            </div>
            <div class="sunken-panel">
                <div class="preview-container" id="previewContainer">
                    <video id="videoElement" style="display:none;"></video>
                    <div id="targetBox">PREVIEW</div>
                </div>
                <!-- 재생 컨트롤 바 -->
                <div class="playback-bar">
                    <button onclick="seekRelative(-5)" title="5초 뒤로">⏮</button>
                    <button id="playBtn" onclick="togglePlay()" title="재생/일시정지">▶</button>
                    <button onclick="stopPlayback()" title="정지">⏹</button>
                    <button onclick="seekRelative(5)" title="5초 앞으로">⏭</button>
                    <span id="timeDisplay">00:00 / 00:00</span>
                </div>
            </div>
        </div>

        <div class="resizer-col-3" id="resizer2"></div>

        <!-- 3. 인스펙터 속성 조절 패널 -->
        <div class="window panel-inspector">
            <div class="title-bar">
                <span>Keyframe Properties</span>
                <div class="title-bar-controls"><button onclick="toggleCollapse(this)">-</button></div>
            </div>
            <div class="sunken-panel">
                <div class="control-group">
                    <label>X Position (<span id="valX">0</span>px)</label>
                    <input type="range" id="rangeX" min="-150" max="150" value="0" oninput="updateKeyframeProperty()">
                </div>
                <div class="control-group">
                    <label>Scale (<span id="valScale">1.0</span>)</label>
                    <input type="range" id="rangeScale" min="0.2" max="2.0" step="0.1" value="1" oninput="updateKeyframeProperty()">
                </div>
                <div class="control-group">
                    <label>Opacity (<span id="valOpacity">1.0</span>)</label>
                    <input type="range" id="rangeOpacity" min="0.1" max="1.0" step="0.1" value="1" oninput="updateKeyframeProperty()">
                </div>
                <button onclick="addKeyframe()" style="width: 100%; margin-top: 6px; background-color: var(--win-blue); color: white; font-weight: bold;">+ 현재 위치에 키프레임 추가</button>
                <button onclick="playAutoAnimation()" style="width: 100%; margin-top: 6px;">미리보기 테스트 재생</button>
            </div>
        </div>

        <div class="resizer-row-2" id="resizer3"></div>

        <!-- 4. 타임라인 패널 -->
        <div class="window panel-timeline">
            <div class="title-bar">
                <span>Timeline & Keyframe Track</span>
                <div class="title-bar-controls"><button onclick="toggleCollapse(this)">-</button></div>
            </div>
            <div class="sunken-panel">
                <div class="timeline-header">
                    <span>타임라인 영역이 대폭 확장되었습니다. 클립과 키프레임을 확인하세요.</span>
                </div>
                <div class="timeline-ruler" id="timelineRuler"></div>
                <div class="timeline-track-area" id="timelineTrack" onclick="seekTimeline(event)">
                    <div id="timelineClipsContainer"></div>
                    <div id="playheadLine"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function changeTheme(themeName) {
            document.getElementById('mainBody').setAttribute('data-theme', themeName);
            localStorage.setItem('idk_theme', themeName);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('idk_theme');
            if (savedTheme) {
                document.getElementById('mainBody').setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelector').value = savedTheme;
            }
            renderRuler();
        });

        function toggleCollapse(btn) {
            const win = btn.closest('.window');
            win.classList.toggle('collapsed');
        }

        const workspace = document.getElementById('workspace');
        const resizer1 = document.getElementById('resizer1');
        const resizer2 = document.getElementById('resizer2');
        const resizer3 = document.getElementById('resizer3');
        let isResizing = null;

        resizer1.addEventListener('mousedown', (e) => { isResizing = 'col1'; resizer1.classList.add('active'); e.preventDefault(); });
        resizer2.addEventListener('mousedown', (e) => { isResizing = 'col3'; resizer2.classList.add('active'); e.preventDefault(); });
        resizer3.addEventListener('mousedown', (e) => { isResizing = 'row2'; resizer3.classList.add('active'); e.preventDefault(); });

        resizer1.addEventListener('dblclick', () => workspace.style.setProperty('--col-1', '240px'));
        resizer2.addEventListener('dblclick', () => workspace.style.setProperty('--col-3', '260px'));
        resizer3.addEventListener('dblclick', () => workspace.style.setProperty('--row-2', '300px'));

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const rect = workspace.getBoundingClientRect();
            if (isResizing === 'col1') {
                let w = e.clientX - rect.left;
                if (w > 150 && w < 500) workspace.style.setProperty('--col-1', w + 'px');
            } else if (isResizing === 'col3') {
                let w = rect.right - e.clientX;
                if (w > 180 && w < 500) workspace.style.setProperty('--col-3', w + 'px');
            } else if (isResizing === 'row2') {
                let h = rect.bottom - e.clientY;
                if (h > 180 && h < 600) workspace.style.setProperty('--row-2', h + 'px');
            }
        });

        window.addEventListener('mouseup', () => {
            isResizing = null;
            [resizer1, resizer2, resizer3].forEach(r => r.classList.remove('active'));
        });

        function resetLayout() {
            workspace.style.setProperty('--col-1', '240px');
            workspace.style.setProperty('--col-3', '260px');
            workspace.style.setProperty('--row-2', '300px');
            document.querySelectorAll('.window.collapsed').forEach(w => w.classList.remove('collapsed'));
        }

        const fileInput = document.getElementById('videoFile');
        const videoElement = document.getElementById('videoElement');
        const targetBox = document.getElementById('targetBox');
        const status = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const playheadLine = document.getElementById('playheadLine');
        const fileListBox = document.getElementById('fileListBox');
        const timelineClipsContainer = document.getElementById('timelineClipsContainer');

        let isVideoLoaded = false;
        let keyframes = {};
        let uploadedFiles = [];
        let selectedFileIndex = null;

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                uploadedFiles.push(file);
                selectedFileIndex = uploadedFiles.length - 1;
                renderFileList();
                loadSelectedFile(selectedFileIndex);
            }
        });

        function renderFileList() {
            fileListBox.innerHTML = '';
            if (uploadedFiles.length === 0) {
                fileListBox.innerHTML = '<div style="color: #888; text-align: center; padding-top: 30px;">업로드된 파일 없음</div>';
                return;
            }
            uploadedFiles.forEach((file, idx) => {
                const item = document.createElement('div');
                item.className = `file-item ${selectedFileIndex === idx ? 'selected' : ''}`;
                item.innerHTML = `<span>📂 ${file.name}</span> <span style="font-size:9px; opacity:0.7;">#${idx+1}</span>`;
                item.onclick = () => {
                    selectedFileIndex = idx;
                    renderFileList();
                    loadSelectedFile(idx);
                };
                fileListBox.appendChild(item);
            });
        }

        function loadSelectedFile(idx) {
            const file = uploadedFiles[idx];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);
            videoElement.src = fileURL;
            videoElement.style.display = 'block';
            targetBox.style.display = 'none';
            status.innerText = `Active: ${file.name}`;
            isVideoLoaded = true;

            videoElement.onloadedmetadata = function () {
                updateTimeDisplay();
                renderTimelineClip(file.name, videoElement.duration);
                renderRuler();
            };
        }

        function renderTimelineClip(name, duration) {
            timelineClipsContainer.innerHTML = '';
            const clip = document.createElement('div');
            clip.className = 'timeline-clip';
            clip.style.left = '0%';
            clip.style.width = '100%';
            clip.innerText = `🎬 ${name} (${formatTime(duration)})`;
            timelineClipsContainer.appendChild(clip);
        }

        function deleteSelectedFile() {
            if (selectedFileIndex === null || uploadedFiles.length === 0) {
                alert('삭제할 파일을 목록에서 먼저 선택해주세요.');
                return;
            }
            
            uploadedFiles.splice(selectedFileIndex, 1);
            
            if (uploadedFiles.length > 0) {
                selectedFileIndex = 0;
                renderFileList();
                loadSelectedFile(selectedFileIndex);
            } else {
                videoElement.pause();
                videoElement.removeAttribute('src');
                videoElement.load();
                videoElement.style.display = 'none';
                targetBox.style.display = 'flex';
                fileInput.value = '';
                status.innerText = '';
                isVideoLoaded = false;
                selectedFileIndex = null;
                timelineClipsContainer.innerHTML = '';
                keyframes = {};
                document.querySelectorAll('.keyframe-marker').forEach(m => m.remove());
                renderFileList();
                updateTimeDisplay();
                renderRuler();
            }
        }

        videoElement.addEventListener('timeupdate', () => {
            updateTimeDisplay();
            updatePlayhead();
            applyCurrentKeyframe();
        });

        videoElement.addEventListener('ended', () => {
            playBtn.innerText = "▶";
        });

        function updateTimeDisplay() {
            const current = formatTime(videoElement.currentTime || 0);
            const duration = formatTime(videoElement.duration || 10);
            timeDisplay.innerText = `${current} / ${duration}`;
        }

        function formatTime(seconds) {
            if (!isFinite(seconds)) seconds = 0;
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function togglePlay() {
            if (!isVideoLoaded) {
                playAutoAnimation();
                return;
            }
            if (videoElement.paused) {
                videoElement.play();
                playBtn.innerText = "❚❚";
            } else {
                videoElement.pause();
                playBtn.innerText = "▶";
            }
        }

        function stopPlayback() {
            if (!isVideoLoaded) return;
            videoElement.pause();
            videoElement.currentTime = 0;
            playBtn.innerText = "▶";
        }

        function seekRelative(delta) {
            if (!isVideoLoaded) return;
            videoElement.currentTime = Math.min(
                Math.max(0, videoElement.currentTime + delta),
                videoElement.duration || 0
            );
        }

        function seekTimeline(event) {
            const track = document.getElementById('timelineTrack');
            const rect = track.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;

            if (isVideoLoaded && videoElement.duration) {
                videoElement.currentTime = percentage * videoElement.duration;
            } else {
                updatePlayhead(percentage * 10);
            }
        }

        function updatePlayhead(forcedTime) {
            const track = document.getElementById('timelineTrack');
            const duration = isVideoLoaded ? (videoElement.duration || 1) : 10;
            const time = forcedTime !== undefined ? forcedTime : videoElement.currentTime;
            const percent = Math.min(100, (time / duration) * 100);
            playheadLine.style.left = percent + '%';
        }

        function renderRuler() {
            const ruler = document.getElementById('timelineRuler');
            ruler.innerHTML = '';
            const duration = isVideoLoaded && videoElement.duration ? videoElement.duration : 10;
            const step = duration > 60 ? 10 : (duration > 20 ? 5 : 1);
            for (let t = 0; t <= duration; t += step) {
                const tick = document.createElement('div');
                tick.className = 'ruler-tick';
                tick.style.left = ((t / duration) * 100) + '%';
                tick.innerText = formatTime(t);
                ruler.appendChild(tick);
            }
        }

        function updateKeyframeProperty() {
            const x = document.getElementById('rangeX').value;
            const scale = document.getElementById('rangeScale').value;
            const opacity = document.getElementById('rangeOpacity').value;

            document.getElementById('valX').innerText = x;
            document.getElementById('valScale').innerText = scale;
            document.getElementById('valOpacity').innerText = opacity;

            const target = isVideoLoaded ? videoElement : targetBox;
            target.style.transform = `translate(${x}px, 0px) scale(${scale})`;
            target.style.opacity = opacity;
        }

        function addKeyframe() {
            const currentTime = isVideoLoaded ? videoElement.currentTime : 0;
            const x = document.getElementById('rangeX').value;
            const scale = document.getElementById('rangeScale').value;
            const opacity = document.getElementById('rangeOpacity').value;

            keyframes[currentTime.toFixed(1)] = { x, scale, opacity };

            const track = document.getElementById('timelineTrack');
            const duration = isVideoLoaded ? (videoElement.duration || 1) : 10;
            const percent = (currentTime / duration) * 100;

            const marker = document.createElement('div');
            marker.className = 'keyframe-marker';
            marker.style.left = `${percent}%`;
            track.appendChild(marker);
        }

        function applyCurrentKeyframe() {
            const currentTime = videoElement.currentTime.toFixed(1);
            if (keyframes[currentTime]) {
                const kf = keyframes[currentTime];
                document.getElementById('rangeX').value = kf.x;
                document.getElementById('rangeScale').value = kf.scale;
                document.getElementById('rangeOpacity').value = kf.opacity;
                updateKeyframeProperty();
            }
        }

        function playAutoAnimation() {
            const target = isVideoLoaded ? videoElement : targetBox;
            target.style.transform = `translateX(80px) scale(1.3)`;
            target.style.opacity = 0.5;
            document.getElementById('rangeX').value = 80;
            document.getElementById('rangeScale').value = 1.3;
            document.getElementById('rangeOpacity').value = 0.5;
            updateKeyframeProperty();

            setTimeout(() => {
                target.style.transform = `translateX(0px) scale(1)`;
                target.style.opacity = 1;
                document.getElementById('rangeX').value = 0;
                document.getElementById('rangeScale').value = 1;
                document.getElementById('rangeOpacity').value = 1;
                updateKeyframeProperty();
            }, 1000);
        }

        function saveProjectToDevice() {
            const projectData = {
                site: "IDK Editsite",
                theme: document.body.getAttribute("data-theme"),
                keyframes: keyframes,
                savedAt: new Date().toISOString()
            };

            const dataString = JSON.stringify(projectData, null, 2);
            const blob = new Blob([dataString], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'idk-project-save.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
