<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IDK Video Editor - v9 Fixed</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0033">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-dark: #808080;
            --win-light: #dfdfdf;
            --win-darker: #404040;
            --win-blue: #000080;
            --win-text: #000000;
            --panel-inner: #ececec;
            --desktop-bg: #008080;
            --accent: #ff00ff;
        }

        body[data-theme="win95-dark"] {
            --win-bg: #2b2b2b;
            --win-dark: #141414;
            --win-light: #424242;
            --win-darker: #000000;
            --win-blue: #1a0033;
            --win-text: #ffccff;
            --panel-inner: #1c1c1c;
            --desktop-bg: #0b0610;
            --accent: #ff33cc;
        }

        body[data-theme="y2k-pink"] {
            --win-bg: #fff0f5;
            --win-dark: #ffb6c1;
            --win-light: #ffffff;
            --win-darker: #d81b60;
            --win-blue: #c2185b;
            --win-text: #4a1525;
            --panel-inner: #ffe4e1;
            --desktop-bg: #fce4ec;
            --accent: #d81b60;
        }

        body[data-theme="matrix-green"] {
            --win-bg: #0d1117;
            --win-dark: #21262d;
            --win-light: #30363d;
            --win-darker: #000000;
            --win-blue: #238636;
            --win-text: #56d364;
            --panel-inner: #161b22;
            --desktop-bg: #010409;
            --accent: #56d364;
        }

        body[data-theme="checker-bw"] {
            --win-bg: #ffffff;
            --win-dark: #999999;
            --win-light: #ffffff;
            --win-darker: #000000;
            --win-blue: #000000;
            --win-text: #000000;
            --panel-inner: #f5f5f5;
            --desktop-bg: #000000;
            --accent: #000000;
        }
        /* 체크무늬 흑백 테마: 바깥 데스크톱 배경에 체크보드 패턴 적용 */
        body[data-theme="checker-bw"] {
            background-image:
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
                linear-gradient(45deg, #000 25%, #fff 25%, #fff 75%, #000 75%, #000);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
        }
        body[data-theme="checker-bw"] .title-bar {
            background: #000;
        }
        body[data-theme="checker-bw"] button:active {
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 4px;
            font-family: 'MS Sans Serif', monospace;
            background-color: var(--desktop-bg);
            color: var(--win-text);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .top-menu-bar {
            height: 35px; background-color: var(--win-bg);
            border: 2px solid; border-color: var(--win-light) var(--win-darker) var(--win-darker) var(--win-light);
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; flex-shrink: 0; margin-bottom: 4px;
        }
        .menu-items { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        button, select, input[type="file"], input[type="text"] {
            background-color: var(--win-bg); color: var(--win-text);
            border-top: 2px solid var(--win-light); border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker); border-bottom: 2px solid var(--win-darker);
            padding: 4px 6px; font-family: inherit; font-size: 11px; cursor: pointer;
        }

        .main-workspace {
            display: grid;
            grid-template-columns: var(--col-1, 240px) 8px 1fr 8px var(--col-3, 260px);
            grid-template-rows: 1fr 8px var(--row-2, 280px);
            flex-grow: 1; gap: 0; overflow: hidden; min-height: 0;
        }

        /* 리사이저: touch-action:none 필수 — 없으면 터치 드래그 시 페이지 스크롤과 충돌함 */
        .resizer-col-1, .resizer-col-3 { grid-row: 1 / span 3; cursor: ew-resize; background: var(--win-dark); touch-action: none; }
        .resizer-col-1 { grid-column: 2; }
        .resizer-col-3 { grid-column: 4; }
        .resizer-row-2 { grid-column: 1 / span 5; grid-row: 2; cursor: ns-resize; background: var(--win-dark); touch-action: none; }
        .resizer-col-1:active, .resizer-col-3:active, .resizer-row-2:active { background: var(--accent); }

        .window {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light); border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker); border-bottom: 2px solid var(--win-darker);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            min-height: 0; min-width: 0;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), var(--win-darker));
            color: white; padding: 3px 6px; font-weight: bold; font-size: 11px;
            display: flex; justify-content: space-between; align-items: center; user-select: none; flex-shrink: 0;
        }
        .title-bar-controls button { width: 16px; height: 14px; font-size: 9px; line-height: 6px; padding: 0; color: black; }

        .sunken-panel {
            background-color: var(--panel-inner);
            border-top: 2px solid var(--win-darker); border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light); border-bottom: 2px solid var(--win-light);
            padding: 6px; overflow: auto; flex-grow: 1; min-height: 0;
        }

        .panel-library { grid-column: 1; grid-row: 1; }
        .panel-preview { grid-column: 3; grid-row: 1; }
        .panel-inspector { grid-column: 5; grid-row: 1 / span 3; }
        .panel-timeline { grid-column: 1 / span 3; grid-row: 3; }

        .panel-preview .sunken-panel { display: flex; flex-direction: column; padding: 0; }
        .preview-container {
            width: 100%; flex: 1 1 auto; min-height: 0;
            display: flex; align-items: center; justify-content: center; background-color: #000; position: relative; overflow: hidden;
        }

        #videoElement, #textOverlayElement { max-width: 100%; max-height: 100%; position: absolute; object-fit: contain; }
        /* ===== 영상 프로젝트 화면비: 가로 16:9 / 세로 9:16 ===== */
        .panel-preview .sunken-panel { overflow: hidden; }
        #previewContainer {
            transition: width .15s ease, height .15s ease;
        }
        #previewContainer.project-landscape {
            width: min(100%, 960px);
            aspect-ratio: 16 / 9;
            height: auto;
            flex: 0 1 auto;
        }
        #previewContainer.project-portrait {
            height: min(100%, 760px);
            aspect-ratio: 9 / 16;
            width: auto;
            flex: 0 1 auto;
        }
        .preview-aspect-badge {
            position:absolute; left:6px; top:6px; z-index:15;
            font-size:10px; padding:3px 6px; background:rgba(0,0,0,.65);
            border:1px solid #fff; color:#fff; pointer-events:none;
        }

        #textOverlayElement {
            font-size: 24px; font-weight: bold; color: white; text-shadow: 2px 2px black; pointer-events: none; display: none; z-index: 5;
            transition: opacity 0.3s ease;
        }

        .playback-bar {
            flex-shrink: 0; width: 100%; background: var(--win-bg); padding: 6px;
            display: flex; align-items: center; justify-content: center; gap: 6px; border-top: 2px solid var(--win-darker);
        }
        /* 터치 타겟 확대 (권장 최소 44px에 가깝게) */
        .playback-bar button { font-size: 15px; font-weight: bold; width: 42px; height: 40px; padding: 0; touch-action: manipulation; }
        #playBtn { background-color: var(--win-blue) !important; color: white !important; width: 52px; }

        /* 이모티콘 대신 쓰는 라인 아이콘: currentColor라서 테마 글자색을 그대로 따라감(다크 테마 = 흰색 계열) */
        .ico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; flex-shrink: 0; }

        .control-group { margin-bottom: 8px; font-size: 11px; }
        .control-group label { display: block; margin-bottom: 3px; }
        .control-group input[type="range"], .control-group select { width: 100%; }

        .file-list-box {
            background: var(--win-darker); border: 1px solid var(--win-light); height: 70px;
            margin-top: 4px; overflow-y: auto; color: white; font-size: 10px; padding: 4px;
        }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 4px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; touch-action: manipulation;
        }
        .file-item.selected { background-color: var(--win-blue); border-color: white; }

        .panel-timeline .sunken-panel { display: flex; flex-direction: column; gap: 4px; overflow: visible; }
        .timeline-tools-bar { display: flex; gap: 4px; margin-bottom: 2px; align-items: center; flex-wrap: wrap; }
        .timeline-tools-bar button { font-size: 10px; padding: 6px 8px; touch-action: manipulation; }

        .timeline-ruler {
            position: relative; height: 20px; border-bottom: 1px solid var(--win-dark);
            font-size: 9px; flex-shrink: 0; overflow: hidden; background: rgba(0,0,0,0.1);
        }
        .ruler-tick { position: absolute; top: 0; border-left: 1px solid var(--win-dark); padding-left: 2px; height: 100%; }

        .timeline-tracks-container {
            display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto;
            min-height: 145px; background-color: var(--win-darker); border: 1px solid var(--win-light);
            overflow: auto; position: relative; touch-action: pan-x;
        }
        .timeline-track {
            position: relative; width: 100%; height: 42px;
            background-color: rgba(0,0,0,0.2); border-bottom: 1px solid var(--win-dark);
        }
        .timeline-track::before {
            content: attr(data-track-name); position: absolute; left: 4px; top: 2px;
            font-size: 9px; color: #aaa; z-index: 5; pointer-events: none;
        }

        /* ===== 타임라인 플레이헤드: 빨간 세로선 + 상단 빨간 역삼각형 ===== */
        #transitionVideoElement{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;display:none;pointer-events:none;z-index:4;}
        #videoElement{position:relative;z-index:3;}
        #textOverlayElement{z-index:6;}
        #playheadLine {
            position: absolute; top: 0; left: 0; width: 2px; height: 100%;
            background: red; z-index: 20; pointer-events: none;
        }
        #playheadHandle {
            position: absolute;
            top: 0;
            left: -7px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid red;
            transform: rotate(180deg);
            z-index: 30;
            cursor: ew-resize;
            touch-action: none;
        }
        .timeline-clip {
            position: absolute; top: 14px; height: 24px; background-color: var(--win-blue);
            border: 1.5px solid white; display: flex; align-items: center; justify-content: space-between;
            padding: 0 8px; font-size: 10px; font-weight: bold; color: white; white-space: nowrap;
            overflow: hidden; z-index: 10; cursor: pointer; border-radius: 2px;
            touch-action: none;
        }
        .timeline-clip.selected { border-color: var(--accent); box-shadow: 0 0 5px var(--accent); background-color: #3b0066; }
        .clip-handle {
            width: 20px; height: 100%; background: rgba(255,255,255,0.9); position: absolute; cursor: ew-resize; top: 0; z-index: 12;
            touch-action: none;
        }
        .clip-handle.left { left: 0; }
        .clip-handle.right { right: 0; }

        /* ===== 세로 모드(휴대폰 기본 방향): 좌우 분할 대신 위아래로 쌓기 ===== */
        @media (orientation: portrait) {
            html, body { height: auto; overflow-y: auto; overflow-x: hidden; }

            .main-workspace {
                display: flex;
                flex-direction: column;
                height: auto;
                overflow: visible;
            }

            /* 리사이저는 세로 쌓기 레이아웃에서는 의미가 없어서 숨김 */
            .resizer-col-1, .resizer-col-3, .resizer-row-2 { display: none; }

            .panel-preview, .panel-timeline, .panel-library, .panel-inspector {
                grid-column: unset !important;
                grid-row: unset !important;
                width: 100%;
            }

            .panel-preview { order: 1; height: 48vh; min-height: 260px; }
            .panel-timeline { order: 2; height: 260px; }
            .panel-library { order: 3; height: 200px; }
            .panel-inspector { order: 4; height: 280px; }
        }
    
        .mini-row{display:flex;gap:5px;align-items:center}
        .mini-row select{flex:1;min-width:0}
        .keyframe-graph{position:relative;height:140px;margin-top:6px;border:1px solid #777;background:#111;overflow:hidden;touch-action:none;cursor:crosshair}
        .keyframe-graph .kf-grid-line{position:absolute;pointer-events:none;background:rgba(255,255,255,.12)}
        .keyframe-graph .kf-grid-line.h{left:0;right:0;height:1px}
        .keyframe-graph .kf-grid-line.v{top:0;bottom:0;width:1px}
        .kf-curve{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
        .kf-segment{position:absolute;height:2px;background:#ff3366;transform-origin:0 50%;pointer-events:none}
        .kf-point{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #ff3366;box-sizing:border-box;transform:translate(-50%,-50%);cursor:grab;z-index:5;touch-action:none}
        .kf-point.active{background:#ff3366}
        .kf-time-label,.kf-value-label{position:absolute;font-size:8px;color:#ddd;pointer-events:none;z-index:4}
        .mini-row{display:flex;gap:4px;align-items:center}
        .mini-row>*{min-width:0}
        .effect-note{font-size:9px;opacity:.8;margin-top:3px;line-height:1.3}
        .kf-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:20% 25%}
        .kf-curve{position:absolute;inset:0;pointer-events:none}
        .kf-segment{position:absolute;height:2px;background:#ff3b30;transform-origin:0 50%;pointer-events:none}
        .kf-point{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff3b30;border:2px solid #fff;box-sizing:border-box;transform:translate(-50%,-50%);cursor:grab;z-index:5;touch-action:none}
        .kf-point:active{cursor:grabbing}
        .kf-label{position:absolute;left:3px;top:3px;font-size:9px;color:#ddd;pointer-events:none}
        .kf-help{font-size:9px;color:#888;margin-top:4px;line-height:1.25}
        #playheadHandle{
            z-index:40;
            touch-action:none;
            top:-12px !important;
            left:-6px;
            width:0; height:0;
            border-left:6px solid transparent;
            border-right:6px solid transparent;
            border-top:11px solid red;
            border-bottom:0;
            transform:none;
            cursor:ew-resize;
            filter:drop-shadow(0 1px 0 #700);
        }
        .transition-badge{position:absolute;top:2px;height:16px;min-width:34px;padding:0 3px;background:#ff9800;color:#111;border:1px solid #fff;font-size:8px;font-weight:bold;line-height:16px;text-align:center;z-index:18;pointer-events:none;border-radius:2px;}
        .speed-badge{position:absolute;right:5px;bottom:2px;background:rgba(0,0,0,.75);color:#fff;font-size:8px;padding:1px 3px;border-radius:2px;z-index:17;pointer-events:none;}
        .transition-line{position:absolute;top:0;height:100%;border-left:2px dashed #ff9800;z-index:17;pointer-events:none;}
        .transition-controls{border-top:1px solid var(--win-dark);margin-top:6px;padding-top:6px;}
        .effect-speed-row{display:flex;gap:5px;align-items:center;}
        .effect-speed-row input{flex:1;}
        .reverse-active{background:#7a0000 !important;color:#fff}


        /* ===== v6 플레이헤드 강화: 타임라인 상단 손잡이 영역 확대 ===== */
        .timeline-ruler-wrap{
            position:relative;
            overflow:visible;
            flex-shrink:0;
        }
        .timeline-ruler-wrap .timeline-ruler{
            overflow:visible;
        }
        #playheadTopHit{
            position:absolute;
            top:-4px;
            left:0;
            width:22px;
            height:26px;
            transform:translateX(-50%);
            z-index:55;
            cursor:ew-resize;
            touch-action:none;
            background:transparent;
        }
        #playheadTopHit::before{
            content:"";
            position:absolute;
            left:6px;
            top:4px;
            width:0;height:0;
            border-left:6px solid transparent;
            border-right:6px solid transparent;
            border-top:11px solid red;
            filter:drop-shadow(0 1px 0 #700);
        }
        #playheadLine{
            pointer-events:none !important;
        }
        .timeline-tracks-container{
            overflow:auto;
        }
        .speed-badge{
            min-width:28px;
            text-align:center;
            font-weight:bold;
        }
        .timeline-clip.has-speed-kf .speed-badge{
            outline:1px solid #ffcc00;
        }


        /* ===== v7 소스 애니메이션 전체 표시 ===== */
        .animation-preset-grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:3px;
            margin-top:5px;
        }
        .animation-preset-btn{
            min-height:28px;
            padding:3px 4px;
            border:1px solid #777;
            background:#222;
            color:#fff;
            font-size:10px;
            line-height:1.15;
            cursor:pointer;
            border-radius:2px;
            touch-action:manipulation;
        }
        .animation-preset-btn:hover{background:#444;}
        .animation-preset-btn.active{
            background:var(--win-blue);
            color:#fff;
            outline:2px solid #fff;
        }
        @media (orientation:portrait){
            .animation-preset-grid{
                grid-template-columns:repeat(3,minmax(0,1fr));
            }
            .animation-preset-btn{
                min-height:32px;
                font-size:10px;
            }
        }


        /* ===== v8 숫자 입력 / 키프레임 그래프 / 필터 ===== */
        .numeric-control-row{
            display:grid;
            grid-template-columns:minmax(0,1fr) 68px;
            gap:5px;
            align-items:center;
        }
        .numeric-control-row input[type="number"]{
            width:100%;
            box-sizing:border-box;
            min-width:0;
        }
        .keyframe-graph{
            min-height:180px;
            height:180px;
            flex-shrink:0;
            display:block;
        }
        .panel-inspector > .sunken-panel{
            overflow-y:auto !important;
            overflow-x:hidden !important;
        }
        .filter-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:4px;
        }
        .filter-item{
            border:1px solid #666;
            padding:3px;
            background:#181818;
        }
        .filter-item label{
            display:flex;
            justify-content:space-between;
            font-size:9px;
            margin-bottom:2px;
        }
        .filter-item input[type="range"]{width:100%;}
        .filter-item input[type="number"]{width:100%;box-sizing:border-box;}
        #imageElement{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:contain;
            display:none;
            pointer-events:none;
            z-index:3;
        }
        #vignetteOverlay{
            position:absolute;
            inset:0;
            display:none;
            pointer-events:none;
            z-index:8;
            background:radial-gradient(ellipse at center,
                transparent 25%,
                rgba(0,0,0,.15) 55%,
                rgba(0,0,0,.85) 100%);
        }
        .filter-preset-row{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:3px;
            margin-bottom:4px;
        }
        .filter-preset-row button{
            font-size:9px;
            min-height:25px;
        }
        @media (orientation:portrait){
            .panel-inspector{height:420px !important;min-height:420px !important;}
            .keyframe-graph{height:190px;min-height:190px;}
            .filter-grid{grid-template-columns:1fr 1fr;}
        }

    
        .keyframe-editor{border-top:1px solid var(--win-dark);margin-top:7px;padding-top:7px;}
        .keyframe-status-row{display:flex;justify-content:space-between;font-size:9px;margin-top:4px;color:#ddd;}
        .keyframe-status-row b{color:#fff;}
        .keyframe-graph{position:relative;height:190px!important;min-height:190px!important;width:100%;background:#101010;border:2px inset #888;overflow:hidden;touch-action:none;cursor:crosshair;}
        .keyframe-graph .kf-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:20% 25%;pointer-events:none;}
        .kf-axis-x,.kf-axis-end{position:absolute;bottom:2px;font-size:8px;color:#aaa;z-index:6;pointer-events:none}.kf-axis-x{left:4px}.kf-axis-end{right:4px}
        .keyframe-graph .kf-curve{position:absolute;inset:0;pointer-events:none;z-index:3}.keyframe-graph .kf-point{z-index:10}.keyframe-graph .kf-segment{z-index:4}
        .animation-preset-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
        .animation-preset-grid .animation-preset-btn{width:100%;min-width:0;white-space:normal;overflow-wrap:anywhere;}

                    <button onclick="splitSelectedClip()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>자르기</button>
                    <button onclick="copySelectedClip()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>복사</button>
                    <button onclick="pasteClip()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>붙여넣기</button>
                    <button onclick="deleteSelectedClips()" style="background-color: #5a1a1a; color: white;"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>삭제</button>
                    <button onclick="moveClipTrack(-1)">▲ 위</button>
                    <button onclick="moveClipTrack(1)">▼ 아래</button>
                    <button id="multiSelectToggleBtn" onclick="toggleMultiSelectMode()" style="background: #333; color: #ffccff;">다중선택: OFF</button>
                    <span style="font-size:10px; margin-left: auto;">줌:</span>
                    <input type="range" id="zoomRange" min="10" max="60" value="30" style="width: 60px;" oninput="renderAll()">
                </div>
                <div class="timeline-ruler-wrap">
                    <div class="timeline-ruler" id="timelineRuler"></div>
                    <div id="playheadTopHit" title="빨간 역삼각형을 드래그해서 재생 위치 이동"></div>
                </div>
                <div class="timeline-tracks-container" id="timelineTracksContainer" onclick="seekTimeline(event)">
                    <div id="playheadLine"></div>
                    <div id="playheadHandle" title="빨간 역삼각형을 드래그해서 재생 위치 이동"></div>
                    <div class="timeline-track" data-track-id="0" data-track-name="Track 1"></div>
                    <div class="timeline-track" data-track-id="1" data-track-name="Track 2"></div>
                    <div class="timeline-track" data-track-id="2" data-track-name="Track 3"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="mobileSheetBackdrop" onclick="closeMobileSheet()"></div>
    <div class="mobile-bottom-tabbar" id="mobileBottomTabbar">
        <button type="button" onclick="openMobileTab('position', this)" title="위치/크기">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
            위치
        </button>
        <button type="button" onclick="openMobileTab('animation', this)" title="애니메이션">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 11 14 10 22 21 10 13 10 13 2"></polygon></svg>
            애니메이션
        </button>
        <button type="button" onclick="openMobileTab('filter', this)" title="필터">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2" fill="currentColor"></circle><line x1="4" y1="12" x2="20" y2="12"></line><circle cx="16" cy="12" r="2" fill="currentColor"></circle><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="11" cy="18" r="2" fill="currentColor"></circle></svg>
            필터
        </button>
        <button type="button" onclick="openMobileTab('speed', this)" title="속도">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0"></path><line x1="12" y1="15" x2="16" y2="10"></line><circle cx="12" cy="15" r="1.2" fill="currentColor"></circle></svg>
            속도
        </button>
        <button type="button" onclick="openMobileTab('volume', this)" title="음량">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15 4 9" fill="currentColor" stroke="none"></polygon><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a9 9 0 0 1 0 12"></path></svg>
            음량
        </button>
        <button type="button" onclick="openMobileTab('transition', this)" title="화면 전환">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"></path><path d="M21 6H8a4 4 0 0 0-4 4"></path><path d="M7 22l-4-4 4-4"></path><path d="M3 18h13a4 4 0 0 0 4-4"></path></svg>
            전환
        </button>
        <button type="button" onclick="openMobileTab('keyframe', this)" title="키프레임">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="8" rx="1" transform="rotate(45 12 12)" fill="currentColor"></rect></svg>
            키프레임
        </button>
    </div>

    <script>
        function changeTheme(themeName) {
            document.getElementById('mainBody').setAttribute('data-theme', themeName);
        }

        // ===== v16: 세로 모드 캡컷 스타일 하단 탭바 =====
        function openMobileTab(tab, btnEl) {
            const panel = document.querySelector('.panel-inspector');
            const backdrop = document.getElementById('mobileSheetBackdrop');
            const wasActive = btnEl.classList.contains('active');

            document.querySelectorAll('.mobile-bottom-tabbar button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel-inspector .control-group').forEach(g => g.classList.remove('mtab-active'));

            if (wasActive) {
                if (panel) panel.classList.remove('mobile-sheet-open');
                if (backdrop) backdrop.classList.remove('show');
                return;
            }

            if (!getSelectedClip()) {
                alert('먼저 타임라인에서 클립을 선택해주세요.');
                return;
            }

            btnEl.classList.add('active');
            document.querySelectorAll(`.panel-inspector .control-group[data-mtab="${tab}"]`).forEach(g => g.classList.add('mtab-active'));
            if (panel) panel.classList.add('mobile-sheet-open');
            if (backdrop) backdrop.classList.add('show');
            if (tab === 'keyframe' && typeof renderKeyframeGraph === 'function') {
                requestAnimationFrame(renderKeyframeGraph);
            }
        }

        function closeMobileSheet() {
            const panel = document.querySelector('.panel-inspector');
            const backdrop = document.getElementById('mobileSheetBackdrop');
            if (panel) panel.classList.remove('mobile-sheet-open');
            if (backdrop) backdrop.classList.remove('show');
            document.querySelectorAll('.mobile-bottom-tabbar button').forEach(b => b.classList.remove('active'));
        }

        // ===== 패널 리사이저: Pointer Events로 통합 (마우스+터치 둘 다 동작) =====
        const workspace = document.getElementById('workspace');
        let isResizing = null;
        const resizer1 = document.getElementById('resizer1');
        const resizer2 = document.getElementById('resizer2');
        const resizer3 = document.getElementById('resizer3');

        function startResize(type) {
            return (e) => { isResizing = type; e.preventDefault(); };
        }
        resizer1.addEventListener('pointerdown', startResize('col1'));
        resizer2.addEventListener('pointerdown', startResize('col3'));
        resizer3.addEventListener('pointerdown', startResize('row2'));

        window.addEventListener('pointermove', (e) => {
            if (!isResizing) return;
            const rect = workspace.getBoundingClientRect();
            if (isResizing === 'col1') {
                let w = e.clientX - rect.left;
                if (w > 150 && w < 500) workspace.style.setProperty('--col-1', w + 'px');
            }
            if (isResizing === 'col3') {
                let w = rect.right - e.clientX;
                if (w > 180 && w < 500) workspace.style.setProperty('--col-3', w + 'px');
            }
            if (isResizing === 'row2') {
                let h = rect.bottom - e.clientY;
                if (h > 100 && h < 500) workspace.style.setProperty('--row-2', h + 'px');
            }
        });
        window.addEventListener('pointerup', () => isResizing = null);
        window.addEventListener('pointercancel', () => isResizing = null);

        let sources = [];
        let timelineClips = [];
        let selectedSourceIndex = null;
        let selectedClipIds = [];
        let copiedClipData = null;
        let isMultiSelectMode = false;
        let projectAspect = 'landscape';
        // v13 버그수정: timelineClock을 여기서 먼저 선언합니다.
        // (원래 아래쪽 1579번째 줄 부근에서 선언되어 있었는데,
        //  901번째 줄의 setProjectAspect('landscape') 호출이 이 변수를 참조하면서
        //  "Cannot access 'timelineClock' before initialization" 오류가 발생 →
        //  스크립트 전체 초기화가 중단되어 애니메이션/키프레임그래프/속도조절 등
        //  타임라인 관련 기능이 전부 먹통이 되는 근본 원인이었습니다.)
        let timelineClock = 0;

        const videoElement = document.getElementById('videoElement');
        const transitionVideoElement = document.getElementById('transitionVideoElement');
        const textOverlayElement = document.getElementById('textOverlayElement');
        const fileListBox = document.getElementById('fileListBox');
        const timelineTracksContainer = document.getElementById('timelineTracksContainer');
        const playheadLine = document.getElementById('playheadLine');
        const playheadHandle = document.getElementById('playheadHandle');
        const playheadTopHit = document.getElementById('playheadTopHit');
        const timeDisplay = document.getElementById('timeDisplay');

        // 트랙 수를 3개로 고정하지 않고 필요할 때 자동으로 늘립니다.
        function ensureTrackCount(trackCount) {
            const needed = Math.max(1, trackCount);
            for (let i = 0; i < needed; i++) {
                if (!timelineTracksContainer.querySelector(`[data-track-id="${i}"]`)) {
                    const track = document.createElement('div');
                    track.className = 'timeline-track';
                    track.dataset.trackId = i;
                    track.dataset.trackName = `Track ${i + 1}`;
                    timelineTracksContainer.appendChild(track);
                }
            }
        }

        function getTrackCount() {
            let maxTrack = 2;
            timelineClips.forEach(c => {
                if (Number.isFinite(Number(c.track))) maxTrack = Math.max(maxTrack, Number(c.track));
            });
            return maxTrack + 1;
        }

        function updatePlayheadPosition(px) {
            const maxX = Math.max(0, timelineTracksContainer.scrollWidth - 2);
            const x = Math.max(0, Math.min(px, maxX));
            playheadLine.style.left = x + 'px';
            playheadHandle.style.left = x + 'px';
            if (playheadTopHit) playheadTopHit.style.left = x + 'px';
            return x;
        }

        let isDraggingPlayhead = false;

        // v14: 역삼각형(플레이헤드 핸들)을 드래그할 때도 실제 타임라인 시계(timelineClock)를
        // 갱신하고 미리보기(영상/이미지/애니메이션/필터/키프레임)를 즉시 반영합니다.
        // 예전 코드는 videoElement.currentTime만 바꿨는데, 현재는 재생이 timelineClock 기준
        // RAF 루프로 동작하므로 그 값만 바꿔서는 미리보기가 전혀 갱신되지 않았습니다.
        function dragSeekToClientX(clientX) {
            const rect = timelineTracksContainer.getBoundingClientRect();
            const x = clientX - rect.left + timelineTracksContainer.scrollLeft;
            const actualX = updatePlayheadPosition(x);
            const zoomFactor = parseFloat(document.getElementById('zoomRange').value) || 30;
            const targetTime = Math.max(0, actualX / zoomFactor);

            timelineClock = targetTime;
            const active = getActiveClipAtTime(targetTime);

            if (active) {
                ensureClipKeyframes(active);
                lastActiveClipId = active.id;
                setActiveVisualSource(active, targetTime);
                updatePlaybackSettingsForTransition(targetTime);
                if (selectedClipIds.includes(active.id)) renderKeyframeGraph();
            }
            applyTransitionPreview(targetTime);

            timeDisplay.innerText = `${targetTime.toFixed(1)}s / ${getMaxDuration().toFixed(1)}s`;
        }

        function startPlayheadDrag(e) {
            e.preventDefault();
            e.stopPropagation();
            isDraggingPlayhead = true;
            stopCustomPlayback();
            e.target.setPointerCapture?.(e.pointerId);
            dragSeekToClientX(e.clientX);
        }

        playheadHandle.addEventListener('pointerdown', startPlayheadDrag);
        if (playheadTopHit) playheadTopHit.addEventListener('pointerdown', startPlayheadDrag);

        window.addEventListener('pointermove', (e) => {
            if (!isDraggingPlayhead) return;
            e.preventDefault();
            dragSeekToClientX(e.clientX);
        }, { passive: false });

        window.addEventListener('pointerup', () => {
            if (!isDraggingPlayhead) return;
            isDraggingPlayhead = false;
            renderTracks();
        });
        window.addEventListener('pointercancel', () => { isDraggingPlayhead = false; });


        // 기본 프로젝트 화면은 가로 16:9이며, 사용자가 세로 9:16으로 바꿀 수 있습니다.
        setProjectAspect('landscape');

        function toggleMultiSelectMode() {
            isMultiSelectMode = !isMultiSelectMode;
            const btn = document.getElementById('multiSelectToggleBtn');
            btn.innerText = `다중선택: ${isMultiSelectMode ? 'ON' : 'OFF'}`;
            btn.style.background = isMultiSelectMode ? 'var(--win-blue)' : '#333';
        }

        document.getElementById('videoFile').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            const tempVid = document.createElement('video');
            tempVid.src = url;
            tempVid.onloadedmetadata = () => {
                const newSource = {
                    id: 'src_' + Date.now(),
                    type: 'video',
                    name: file.name,
                    url: url,
                    duration: tempVid.duration || 10
                };
                sources.push(newSource);

                const newClip = {
                    id: 'clip_' + Date.now(),
                    sourceId: newSource.id,
                    name: newSource.name,
                    type: 'video',
                    track: 0,
                    start: 0,
                    duration: Math.min(newSource.duration, 10),
                    url: url,
                    x: 0, y: 0, scale: 1, opacity: 1, rotation: 0, speed: 1, volume: 100, anim: 'none', animDuration: 1, transition: {type:'none',duration:0.5}, direction: 'forward'
                };
                timelineClips.push(newClip);

                videoElement.src = url;
                selectedClipIds = [newClip.id];
                loadClipProperties(newClip);

                renderAll();
            };
        };


        document.getElementById('imageFile').onchange=(e)=>{
            const file=e.target.files[0]; if(!file)return;
            const url=URL.createObjectURL(file);
            const newSource={id:'src_'+Date.now(),type:'image',name:file.name,url,duration:5};
            sources.push(newSource);
            const newClip={id:'clip_'+Date.now(),sourceId:newSource.id,name:newSource.name,type:'image',track:0,start:0,duration:5,url,
                x:0,y:0,scale:1,opacity:1,rotation:0,speed:1,volume:100,anim:'none',animDuration:1,
                transition:{type:'none',duration:.5},direction:'forward',filter:getClipFilterDefaults()};
            timelineClips.push(newClip);
            selectedClipIds=[newClip.id];
            loadClipProperties(newClip);
            renderAll();
        };

        function addTextSource() {
            const txt = document.getElementById('textInput').value.trim();
            if (!txt) return;
            const newSource = {
                id: 'src_' + Date.now(),
                type: 'text',
                name: txt,
                duration: 5
            };
            sources.push(newSource);
            timelineClips.push({
                id: 'clip_' + Date.now(),
                sourceId: newSource.id,
                name: txt,
                type: 'text',
                track: 0,
                start: 0,
                duration: 5,
                x: 0, y: 0, scale: 1, opacity: 1, rotation: 0, speed: 1, volume: 100, anim: 'none', animDuration: 1, transition: {type:'none',duration:0.5}, direction: 'forward'
            });
            document.getElementById('textInput').value = '';
            renderAll();
        }

        function getMaxDuration() {
            let max = 20;
            timelineClips.forEach(c => {
                if (c.start + c.duration > max) max = c.start + c.duration;
            });
            return max + 5;
        }

        function renderAll() {
            renderFileList();
            renderTracks();
            renderRuler();
        }

        function renderFileList() {
            fileListBox.innerHTML = '';
            if (sources.length === 0) {
                fileListBox.innerHTML = '<div style="color: #888; text-align: center; padding-top: 15px;">소스 없음</div>';
                return;
            }
            sources.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = `file-item ${selectedSourceIndex === idx ? 'selected' : ''}`;
                const iconSvg = s.type === 'video'
                    ? '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>'
                    : '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>';
                item.innerHTML = `<span style="display:flex; align-items:center;">${iconSvg}${s.name}</span>`;
                item.onclick = () => { selectedSourceIndex = idx; renderFileList(); };
                fileListBox.appendChild(item);
            });
        }

        function renderTracks() {
            const existingClips = timelineTracksContainer.querySelectorAll('.timeline-clip');
            existingClips.forEach(el => el.remove());

            // 클립이 이동/추가될 때 필요한 트랙을 자동 생성
            ensureTrackCount(getTrackCount());

            const maxDur = getMaxDuration();
            const zoomFactor = parseFloat(document.getElementById('zoomRange').value) || 30;

            timelineTracksContainer.style.width = Math.max(timelineTracksContainer.clientWidth, maxDur * zoomFactor) + 'px';

            timelineClips.forEach(clip => {
                const trackEl = timelineTracksContainer.querySelector(`[data-track-id="${clip.track}"]`);
                if (!trackEl) return;

                const clipEl = document.createElement('div');
                const isSelected = selectedClipIds.includes(clip.id);
                const hasSpeedKf = !!(clip.keyframes && clip.keyframes.speed && clip.keyframes.speed.length > 1);
                clipEl.className = `timeline-clip ${isSelected ? 'selected' : ''} ${hasSpeedKf ? 'has-speed-kf' : ''}`;

                const leftPx = clip.start * zoomFactor;
                const widthPx = clip.duration * zoomFactor;

                clipEl.style.left = `${leftPx}px`;
                clipEl.style.width = `${widthPx}px`;
                const speedValue = Number(clip.speed || 1);
                const speedText = speedValue === 1 ? '1.0x' : `${speedValue.toFixed(1)}x`;
                const speedKf = hasSpeedKf ? ' ↕KF' : '';
                clipEl.innerHTML = `<span>${clip.name}</span><span class="speed-badge">${speedText}${speedKf}</span>`;
                if (clip.transition && clip.transition.type && clip.transition.type !== 'none') {
                    const badge = document.createElement('div');
                    badge.className = 'transition-badge';
                    const labels = {dissolve:'DISSOLVE','wipe-left':'WIPE ←','wipe-right':'WIPE →','wipe-up':'WIPE ↑','wipe-down':'WIPE ↓'};
                    badge.textContent = labels[clip.transition.type] || 'TRANS';
                    badge.style.left = '0px';
                    clipEl.appendChild(badge);
                }

                // 전환 구간을 클립의 시작점에 시각적으로 표시
                if (clip.transition && clip.transition.type && clip.transition.type !== 'none') {
                    const tline = document.createElement('div');
                    tline.className = 'transition-line';
                    tline.style.left = '0px';
                    clipEl.appendChild(tline);
                }

                // 선택 로직: click 하나에만 연결 (포인터 이벤트는 마우스든 터치든 클릭을 한 번만 발생시킴)
                const handleSelect = (e) => {
                    e.stopPropagation();
                    if (isMultiSelectMode || e.ctrlKey) {
                        if (isSelected) {
                            selectedClipIds = selectedClipIds.filter(id => id !== clip.id);
                        } else {
                            selectedClipIds.push(clip.id);
                        }
                    } else {
                        selectedClipIds = [clip.id];
                        loadClipProperties(clip);
                    }
                    renderTracks();
                };
                clipEl.onclick = handleSelect;

                const leftHandle = document.createElement('div');
                leftHandle.className = 'clip-handle left';
                leftHandle.addEventListener('pointerdown', (e) => initResizeClip(e, clip, 'left', zoomFactor));

                const rightHandle = document.createElement('div');
                rightHandle.className = 'clip-handle right';
                rightHandle.addEventListener('pointerdown', (e) => initResizeClip(e, clip, 'right', zoomFactor));

                clipEl.addEventListener('pointerdown', (e) => {
                    if (e.target.classList.contains('clip-handle')) return;
                    initMoveClipX(e, clip, zoomFactor);
                });

                clipEl.appendChild(leftHandle);
                clipEl.appendChild(rightHandle);
                trackEl.appendChild(clipEl);
            });
        }

        function loadClipProperties(clip) {
            document.getElementById('rangeX').value = clip.x || 0;
            document.getElementById('valX').innerText = clip.x || 0;
            if (document.getElementById('rangeY')) { document.getElementById('rangeY').value = clip.y || 0; document.getElementById('valY').innerText = clip.y || 0; }
            if (document.getElementById('rangeRotation')) { document.getElementById('rangeRotation').value = clip.rotation || 0; document.getElementById('valRotation').innerText = clip.rotation || 0; }
            document.getElementById('rangeScale').value = clip.scale || 1;
            document.getElementById('valScale').innerText = clip.scale || 1;
            document.getElementById('rangeOpacity').value = clip.opacity || 1;
            document.getElementById('valOpacity').innerText = clip.opacity || 1;
            document.getElementById('rangeSpeed').value = clip.speed || 1;

        function initResizeClip(e, clip, direction, zoomFactor) {
            e.stopPropagation();
            e.preventDefault();
            const startX = e.clientX;
            const initialStart = clip.start;
            const initialDuration = clip.duration;

            function onMove(moveEvent) {
                moveEvent.preventDefault();
                const deltaX = moveEvent.clientX - startX;
                const deltaTime = deltaX / zoomFactor;

                if (direction === 'right') {
                    let newDur = initialDuration + deltaTime;
                    if (newDur >= 0.5) clip.duration = newDur;
                } else if (direction === 'left') {
                    let newStart = initialStart + deltaTime;
                    let newDur = initialDuration - deltaTime;
                    if (newStart >= 0 && newDur >= 0.5) {
                        clip.start = newStart;
                        clip.duration = newDur;
                    }
                }
                renderTracks();
                renderRuler();
            }

            function onEnd() {
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                window.removeEventListener('pointercancel', onEnd);
            }

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd);
            window.addEventListener('pointercancel', onEnd);
        }

        function initMoveClipX(e, clip, zoomFactor) {
            e.stopPropagation();
            e.preventDefault();
            if (!selectedClipIds.includes(clip.id)) {
                selectedClipIds = [clip.id];
                loadClipProperties(clip);
                renderTracks();
            }
            const startX = e.clientX;
            const initialStart = clip.start;

            function onMove(moveEvent) {
                moveEvent.preventDefault();
                const deltaX = moveEvent.clientX - startX;
                const deltaTime = deltaX / zoomFactor;
                let newStart = initialStart + deltaTime;
                if (newStart < 0) newStart = 0;
                clip.start = newStart;
                renderTracks();
                renderRuler();
            }

            function onEnd() {
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                window.removeEventListener('pointercancel', onEnd);
            }

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd);
            window.addEventListener('pointercancel', onEnd);
        }

        function ensureClipKeyframes(clip) {
            if (!clip.keyframes) clip.keyframes = {};
            const defaults = {x:Number(clip.x)||0,y:Number(clip.y)||0,scale:Number(clip.scale)||1,opacity:Number(clip.opacity)||1,rotation:Number(clip.rotation)||0,volume:Number(clip.volume ?? 100),speed:Number(clip.speed)||1};
            Object.keys(defaults).forEach(prop => {
                if (!Array.isArray(clip.keyframes[prop])) clip.keyframes[prop] = [];
                if (clip.keyframes[prop].length === 0) {
                    clip.keyframes[prop].push({time:0,value:defaults[prop],ease:'linear'});
