        function getKeyframeRange(prop, clip) {
            const ranges = {
                x:[-300,300], y:[-300,300], scale:[0.1,3], opacity:[0,1], rotation:[-360,360], volume:[0,100], speed:[0.1,4]
            };
            return ranges[prop] || [0,1];
        }

        function easeValue(t, ease) {
            t = Math.max(0, Math.min(1, t));
            if (ease === 'ease-in') return t*t;
            if (ease === 'ease-out') return 1-(1-t)*(1-t);
            if (ease === 'ease-in-out') return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
            return t;
        }

        function interpolateKeyframes(points, time, fallback) {
            if (!points || !points.length) return fallback;
            const sorted=[...points].sort((a,b)=>a.time-b.time);
            if (time <= sorted[0].time) return Number(sorted[0].value);
            if (time >= sorted[sorted.length-1].time) return Number(sorted[sorted.length-1].value);
            for (let i=0;i<sorted.length-1;i++) {
                const a=sorted[i], b=sorted[i+1];
                if (time>=a.time && time<=b.time) {
                    const raw=(time-a.time)/Math.max(.0001,b.time-a.time);
                    const t=easeValue(raw,a.ease||'linear');
                    return Number(a.value)+(Number(b.value)-Number(a.value))*t;
                }
            }
            return fallback;
        }

        function addKeyframeAtPlayhead() {
            const clip=getSelectedClip();
            if (!clip) { alert('키프레임을 추가할 클립을 선택해주세요.'); return; }

            ensureClipKeyframes(clip);
            const prop=document.getElementById('keyframeProperty').value;
            const local=Math.max(0,Math.min(Number(clip.duration)||0,
                timelineClock-Number(clip.start||0)));

            const fallback={
                x:Number(clip.x)||0,
                y:Number(clip.y)||0,
                scale:Number(clip.scale)||1,
                opacity:Number(clip.opacity??1),
                rotation:Number(clip.rotation)||0,
                volume:Number(clip.volume??100),
                speed:Number(clip.speed)||1
            };

            // 현재 시간의 키프레임 보간값을 그대로 새 키프레임 값으로 사용
            const value=interpolateKeyframes(
                clip.keyframes[prop], local, fallback[prop]
            );

            const arr=clip.keyframes[prop];
            const existing=arr.find(k=>Math.abs(Number(k.time)-local)<.03);
            const ease=document.getElementById('keyframeEase')?.value || 'ease-in-out';

            if(existing){
                existing.value=value;
                existing.ease=ease;
            }else{
                arr.push({time:local,value,ease});
            }

            arr.sort((a,b)=>Number(a.time)-Number(b.time));
            renderKeyframeGraph();
            requestAnimationFrame(()=>document.getElementById('keyframeGraph')?.scrollIntoView({block:'nearest'}));
            applyAnimations(clip,timelineClock);
            renderTracks();
        }

        function renderKeyframeGraph() {
            const clip=getSelectedClip();
            const graph=document.getElementById('keyframeGraph');
            const curve=document.getElementById('keyframeCurve');
            if(!graph||!curve) return;
            curve.innerHTML='';
            graph.querySelectorAll('.kf-grid-line,.kf-value-label').forEach(n=>n.remove());
            if(!clip) return;
            ensureClipKeyframes(clip);
            const prop=document.getElementById('keyframeProperty').value;
            const pts=clip.keyframes[prop].sort((a,b)=>a.time-b.time);
            const w=Math.max(160,graph.clientWidth||240), h=graph.clientHeight||140;
            const [minV,maxV]=getKeyframeRange(prop,clip);
            const xOf=t=>6+(t/Math.max(.001,clip.duration))*(w-12);
            const yOf=v=>h-8-((Number(v)-minV)/Math.max(.001,maxV-minV))*(h-16);
            const currentLocal=Math.max(0,Math.min(Number(clip.duration)||0,Number(timelineClock)-Number(clip.start||0)));
            const currentValue=interpolateKeyframes(pts,currentLocal,Number(clip[prop])||0);
            const kt=document.getElementById('keyframeCurrentTime'); const kv=document.getElementById('keyframeCurrentValue'); const ke=document.getElementById('kfAxisEnd');
            if(kt)kt.textContent=currentLocal.toFixed(2)+'s';
            if(kv)kv.textContent=Number(currentValue).toFixed((prop==='scale'||prop==='opacity'||prop==='speed')?2:1);
            if(ke)ke.textContent=(Number(clip.duration)||0).toFixed(1)+'s';

            for(let i=1;i<5;i++){
                const hl=document.createElement('div'); hl.className='kf-grid-line h'; hl.style.top=(i*h/5)+'px'; graph.appendChild(hl);
                const vl=document.createElement('div'); vl.className='kf-grid-line v'; vl.style.left=(i*w/5)+'px'; graph.appendChild(vl);
            }
            if(pts.length>1){
                for(let i=0;i<pts.length-1;i++){
                    const a=pts[i],b=pts[i+1],x1=xOf(a.time),y1=yOf(a.value),x2=xOf(b.time),y2=yOf(b.value);
                    const seg=document.createElement('div'); seg.className='kf-segment';
                    const dx=x2-x1,dy=y2-y1;
                    seg.style.left=x1+'px'; seg.style.top=y1+'px'; seg.style.width=Math.hypot(dx,dy)+'px'; seg.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;
                    curve.appendChild(seg);
                }
            }
            pts.forEach((p,idx)=>{
                const el=document.createElement('div'); el.className='kf-point';
                el.style.left=xOf(p.time)+'px'; el.style.top=yOf(p.value)+'px';
                el.title=`${p.time.toFixed(2)}s / ${Number(p.value).toFixed(2)} / ${p.ease||'linear'}`;
                el.addEventListener('pointerdown',e=>{
                    e.preventDefault(); e.stopPropagation();
                    const rect=graph.getBoundingClientRect();
                    const move=ev=>{
                        const xx=Math.max(6,Math.min(w-6,ev.clientX-rect.left));
                        const yy=Math.max(8,Math.min(h-8,ev.clientY-rect.top));
                        p.time=Math.max(0,Math.min(clip.duration,((xx-6)/Math.max(1,w-12))*clip.duration));
                        p.value=Math.max(minV,Math.min(maxV,minV+((h-8-yy)/Math.max(1,h-16))*(maxV-minV)));
                        pts.sort((a,b)=>a.time-b.time); renderKeyframeGraph();
                        applyAnimations(clip,timelineClock||clip.start);
                    };
                    const end=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end)};
                    window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',end); window.addEventListener('pointercancel',end);
                });
                el.addEventListener('dblclick',e=>{
                    e.preventDefault(); e.stopPropagation();
                    if(pts.length>1){clip.keyframes[prop]=clip.keyframes[prop].filter(k=>k!==p);renderKeyframeGraph();}
                });
                curve.appendChild(el);
            });

            const labels=document.createElement('div'); labels.className='kf-value-label'; labels.style.left='4px'; labels.style.top='2px'; labels.innerText=`${maxV}`; graph.appendChild(labels);
            const minLabel=document.createElement('div'); minLabel.className='kf-value-label'; minLabel.style.left='4px'; minLabel.style.bottom='2px'; minLabel.innerText=`${minV}`; graph.appendChild(minLabel);
            graph.onclick=e=>{
                if(e.target!==graph && !e.target.classList.contains('kf-grid-line')) return;
                const rect=graph.getBoundingClientRect(); const xx=e.clientX-rect.left, yy=e.clientY-rect.top;
                const t=Math.max(0,Math.min(clip.duration,((xx-6)/Math.max(1,w-12))*clip.duration));
                const v=Math.max(minV,Math.min(maxV,minV+((h-8-yy)/Math.max(1,h-16))*(maxV-minV)));
                clip.keyframes[prop].push({time:t,value:v,ease:document.getElementById('keyframeEase')?.value||'ease-in-out'});
                clip.keyframes[prop].sort((a,b)=>a.time-b.time); renderKeyframeGraph();
            };
        }

        function updateEffectDuration(){
            const clip=getSelectedClip(); if(!clip) return;
            clip.animDuration=Math.max(.1,Math.min(3,Number(document.getElementById('animDuration').value)||1));
            document.getElementById('valAnimDuration').innerText=clip.animDuration.toFixed(1)+'s';
            syncNumericFromRange('animDuration');
            renderTracks();
        }

        function updateTransitionSettings(){
            const clip=getSelectedClip(); if(!clip) return;
            clip.transition=clip.transition||{type:'none',duration:.5};
            clip.transition.type=document.getElementById('transitionSelect').value;
            clip.transition.duration=Math.max(.1,Math.min(2,Number(document.getElementById('transitionDuration').value)||.5));
            document.getElementById('valTransitionDuration').innerText=clip.transition.duration.toFixed(1)+'s';
            syncNumericFromRange('transitionDuration');
            renderTracks();
        }

        function findTransitionPair(t){
            const clips=timelineClips.filter(c=>c.type==='video').sort((a,b)=>a.start-b.start);
            for(const incoming of clips){
                const tr=incoming.transition; if(!tr || !tr.type || tr.type==='none') continue;
                const dur=Math.min(Number(tr.duration)||.5, Math.max(.1,incoming.duration));
                const outgoing=clips.filter(c=>c.track===incoming.track && c.id!==incoming.id && c.start+ c.duration >= incoming.start-0.02 && c.start < incoming.start)
                    .sort((a,b)=>(b.start+b.duration)-(a.start+a.duration))[0];
                if(!outgoing) continue;
                const start=incoming.start-dur/2, end=incoming.start+dur/2;
                if(t>=start && t<=end) return {outgoing,incoming,tr,p:Math.max(0,Math.min(1,(t-start)/Math.max(.001,end-start)))};
            }
            return null;
        }

        function setVideoSourceAndTime(el,clip,globalTime){
            if(!clip || !clip.url || !el) return;
            if(el.src!==clip.url) {
                el.src=clip.url;
                try{el.load();}catch(_){}
            }
            const timelineLocal=Math.max(0,Math.min(Number(clip.duration)||0,
                Number(globalTime)-Number(clip.start||0)));
            const mediaLocal=Math.max(0,mediaTimeForTimeline(clip,timelineLocal));
            try{
                if(Math.abs((el.currentTime||0)-mediaLocal)>.08) el.currentTime=mediaLocal;
            }catch(_){}
        }


        function setActiveVisualSource(clip,globalTime){
            const imageElement=document.getElementById('imageElement');
            if(!clip)return;
            if(clip.type==='image'){
                videoElement.style.display='none';
                imageElement.style.display='block';
                if(imageElement.src!==clip.url) imageElement.src=clip.url;
                applyAnimations(clip,globalTime);
                applyFilterToElement(imageElement,clip);
                updateVignetteOverlay(clip);
            }else{
                imageElement.style.display='none';
                videoElement.style.display='block';
                setVideoSourceAndTime(videoElement,clip,globalTime);
                applyAnimations(clip,globalTime);
                applyFilterToElement(videoElement,clip);
                updateVignetteOverlay(clip);
            }
        }

        function applyTransitionPreview(t){
            const pair=findTransitionPair(t);
            if(!transitionVideoElement){return false;}
            if(!pair){
                transitionVideoElement.style.opacity='0';
                transitionVideoElement.style.display='none';
                videoElement.style.clipPath='none';
                return false;
            }
            transitionVideoElement.style.display='block';
            const p=pair.p;
            // 전환 중에는 메인 레이어가 앞 장면, 두 번째 레이어가 뒤 장면을 담당합니다.
            setVideoSourceAndTime(videoElement,pair.outgoing,t);
            setVideoSourceAndTime(transitionVideoElement,pair.incoming,t);
            transitionVideoElement.muted=true;
            applyAnimations(pair.outgoing,t);
            // incoming animation is applied to the second video by the same transform logic
            applyAnimationsToElement(pair.incoming,t,transitionVideoElement);
            const incomingBaseOpacity=Math.max(0,Math.min(1,Number(transitionVideoElement.style.opacity||1)));
            videoElement.style.opacity=Math.max(0,Math.min(1,Number(videoElement.style.opacity||1)*(pair.tr.type==='dissolve'?(1-p):1)));
            transitionVideoElement.style.opacity=incomingBaseOpacity*(pair.tr.type==='dissolve'?p:1);
            if(pair.tr.type==='wipe-left') transitionVideoElement.style.clipPath=`inset(0 ${100-p*100}% 0 0)`;
            else if(pair.tr.type==='wipe-right') transitionVideoElement.style.clipPath=`inset(0 0 0 ${100-p*100}%)`;
            else if(pair.tr.type==='wipe-up') transitionVideoElement.style.clipPath=`inset(${100-p*100}% 0 0 0)`;
            else if(pair.tr.type==='wipe-down') transitionVideoElement.style.clipPath=`inset(0 0 ${100-p*100}% 0)`;
            else if(pair.tr.type==='dissolve') transitionVideoElement.style.clipPath='none';
            else transitionVideoElement.style.clipPath='none';
            return true;
        }

        function applyAnimationsToElement(clip,currTime,el){
            if(!clip || !el) return;
            ensureClipKeyframes(clip);

            const local=Math.max(0,Math.min(Number(clip.duration)||0,
                Number(currTime)-Number(clip.start||0)));

            const x=interpolateKeyframes(clip.keyframes.x,local,Number(clip.x)||0);
            const y=interpolateKeyframes(clip.keyframes.y,local,Number(clip.y)||0);
            const scale=interpolateKeyframes(clip.keyframes.scale,local,Number(clip.scale)||1);
            const opBase=interpolateKeyframes(clip.keyframes.opacity,local,Number(clip.opacity)||1);
            const rot=interpolateKeyframes(clip.keyframes.rotation,local,Number(clip.rotation)||0);

            const phase=Math.max(.1,Math.min(Number(clip.animDuration||1),Number(clip.duration)||1));
            const inP=easeValue(Math.max(0,Math.min(1,local/phase)),'ease-out');
            const outP=easeValue(Math.max(0,Math.min(1,((Number(clip.duration)||0)-local)/phase)),'ease-in');

            let tx=x,ty=y,sc=scale,op=opBase,r=rot,blur=0;
            let clipPath='none';
            const a=clip.anim||'none';

            if(a==='fade-in'||a==='fade-in-out') op*=inP;
            if(a==='fade-out'||a==='fade-in-out') op*=outP;

            if(a==='iris-in'){
                const radius=75*inP;
                clipPath=`circle(${radius}% at 50% 50%)`;
            }else if(a==='iris-out'){
                const radius=75*outP;
                clipPath=`circle(${radius}% at 50% 50%)`;
            }

            const animOffset=getProjectAnimationOffsets();
            if(a==='slide-left') tx-=animOffset.x*(1-inP);
            if(a==='slide-right') tx+=animOffset.x*(1-inP);
            if(a==='slide-up') ty+=animOffset.y*(1-inP);
            if(a==='slide-down') ty-=animOffset.y*(1-inP);
            if(a==='zoom-in') sc*=.35+.65*inP;
            if(a==='zoom-out') sc*=1.65-.65*inP;
            if(a==='rotate-in') r-=360*(1-inP);
            if(a==='rotate-out') r+=360*(1-outP);
            if(a==='bounce') sc*=1+Math.sin(inP*Math.PI)*.12;
            if(a==='blur-in') blur=12*(1-inP);
            if(a==='blur-out') blur=12*(1-outP);
            if(a==='pop') sc*=.15+.85*inP;
            if(a==='shake') tx+=Math.sin(local*42)*(1-outP)*8;

            el.style.transform=`translate(${tx}px,${ty}px) scale(${sc}) rotate(${r}deg)`;
            el.style.opacity=Math.max(0,Math.min(1,op));
            el.style.filter=`blur(${blur}px)`;
            applyFilterToElement(el,clip);
            el.style.clipPath=clipPath;
        }

        function updateTransitionPlayback(t){
            const pair=findTransitionPair(t);
            if(!pair || !transitionVideoElement) return false;
            setVideoSourceAndTime(transitionVideoElement,pair.incoming,t);
            if(!videoElement.paused){
                transitionVideoElement.play().catch(()=>{});
            } else transitionVideoElement.pause();
            return true;
        }


        // 가로/세로 프로젝트 공통 렌더링 기준. 화면 비율이 바뀌어도 애니메이션/필터/키프레임은 같은 클립에 계속 적용됩니다.
        function getProjectCanvasSize(){
            return projectAspect === 'portrait' ? {width:1080,height:1920} : {width:1920,height:1080};
        }
        function getProjectAnimationOffsets(){
            const size=getProjectCanvasSize();
            return {x:Math.max(220,size.width*0.18), y:Math.max(220,size.height*0.18)};
        }

        function setProjectAspect(mode) {
            projectAspect = mode === 'portrait' ? 'portrait' : 'landscape';
            const box = document.getElementById('previewContainer');
            const badge = document.getElementById('previewAspectBadge');
            if (!box) return;

            box.classList.toggle('project-landscape', projectAspect === 'landscape');
            box.classList.toggle('project-portrait', projectAspect === 'portrait');
            if (badge) badge.innerText = projectAspect === 'landscape' ? '가로 16:9' : '세로 9:16';

            // 가로/세로 어느 모드에서도 동일한 클립 렌더링 파이프라인을 다시 적용합니다.
            [videoElement, document.getElementById('imageElement'), transitionVideoElement, textOverlayElement].forEach(el=>{
                if(!el) return;
                el.style.objectFit='contain';
                el.style.maxWidth='100%';
                el.style.maxHeight='100%';
            });

            const clip=getSelectedClip();
            if(clip){
                ensureClipKeyframes(clip);
                applyAnimations(clip, timelineClock || clip.start || 0);
                applyFilterToElement(videoElement,clip);
                applyFilterToElement(document.getElementById('imageElement'),clip);
                updateVignetteOverlay(clip);
                renderKeyframeGraph();
            }
            // 화면비 변경 직후에도 전환 미리보기를 같은 기준으로 갱신합니다.
            if(typeof applyTransitionPreview==='function') applyTransitionPreview(timelineClock || 0);
        }

        function updatePlaybackSettings() {
            const clip=getSelectedClip();
            const dir=document.getElementById('directionSelect').value;
            const speed=Math.max(.1,Math.min(4,parseFloat(document.getElementById('speedNumber').value)||1));
            if(clip){ clip.direction=dir; clip.speed=speed; ensureClipKeyframes(clip); }
            reversePlayback=dir==='reverse';
            pingPongDirection=1;
            document.getElementById('rangeSpeed').value=Math.min(4,speed);
            document.getElementById('valSpeed').innerText=speed.toFixed(1);
            const btn=document.getElementById('reversePlayBtn'); if(btn) btn.classList.toggle('reverse-active',reversePlayback);
            if(!videoElement.paused) startDirectionalLoop();
        }

        function applyAnimations(clip, timelineTime) {
            if (!clip) return;
            ensureClipKeyframes(clip);

            const local = Math.max(0, Math.min(Number(clip.duration)||0,
                Number(timelineTime)-Number(clip.start||0)));

            const x = interpolateKeyframes(clip.keyframes.x, local, Number(clip.x)||0);
            const y = interpolateKeyframes(clip.keyframes.y, local, Number(clip.y)||0);
            const scale = interpolateKeyframes(clip.keyframes.scale, local, Number(clip.scale)||1);
            const opacityBase = interpolateKeyframes(clip.keyframes.opacity, local, Number(clip.opacity)||1);
            const rotation = interpolateKeyframes(clip.keyframes.rotation, local, Number(clip.rotation)||0);
            const volume = interpolateKeyframes(clip.keyframes.volume, local, Number(clip.volume ?? 100));
            const speed = interpolateKeyframes(clip.keyframes.speed, local, Number(clip.speed)||1);

            const phase = Math.max(.1, Math.min(Number(clip.animDuration||1), Number(clip.duration)||1));
            const inP = easeValue(Math.max(0, Math.min(1, local/phase)), 'ease-out');
            const outP = easeValue(Math.max(0, Math.min(1, ((Number(clip.duration)||0)-local)/phase)), 'ease-in');

            let tx=x, ty=y, sc=scale, op=opacityBase, rot=rotation, blur=0;
            let clipPath='none';
            const anim=clip.anim||'none';

            if(anim==='fade-in'||anim==='fade-in-out') op*=inP;
            if(anim==='fade-out'||anim==='fade-in-out') op*=outP;

            if(anim==='iris-in'){
                clipPath=`circle(${75*inP}% at 50% 50%)`;
            }else if(anim==='iris-out'){
                clipPath=`circle(${75*outP}% at 50% 50%)`;
            }

            const animOffset=getProjectAnimationOffsets();
            if(anim==='slide-left') tx-=animOffset.x*(1-inP);
            if(anim==='slide-right') tx+=animOffset.x*(1-inP);
            if(anim==='slide-up') ty+=animOffset.y*(1-inP);
            if(anim==='slide-down') ty-=animOffset.y*(1-inP);
            if(anim==='zoom-in') sc*=.35+.65*inP;
            if(anim==='zoom-out') sc*=1.65-.65*inP;
            if(anim==='rotate-in') rot-=360*(1-inP);
            if(anim==='rotate-out') rot+=360*(1-outP);
            if(anim==='bounce') sc*=1+Math.sin(inP*Math.PI)*.12;
            if(anim==='blur-in') blur=12*(1-inP);
            if(anim==='blur-out') blur=12*(1-outP);
            if(anim==='pop') sc*=.15+.85*inP;
            if(anim==='shake') tx+=Math.sin(local*42)*(1-outP)*8;

            const transform=`translate(${tx}px,${ty}px) scale(${sc}) rotate(${rot}deg)`;
            videoElement.style.transform=transform;
            videoElement.style.opacity=Math.max(0,Math.min(1,op));
            videoElement.style.filter=`blur(${blur}px)`;
            applyFilterToElement(videoElement,clip);
            videoElement.style.clipPath=clipPath;
            updateVignetteOverlay(clip);

            textOverlayElement.style.transform=transform;
            textOverlayElement.style.opacity=Math.max(0,Math.min(1,op));
            textOverlayElement.style.filter=`blur(${blur}px)`;
            textOverlayElement.style.clipPath=clipPath;
            const imageElement=document.getElementById('imageElement');
            if(imageElement && clip.type==='image'){
                imageElement.style.transform=transform;
                imageElement.style.opacity=Math.max(0,Math.min(1,op));
                imageElement.style.filter=`${getComputedStyle(imageElement).filter}`;
                applyFilterToElement(imageElement,clip);
                imageElement.style.clipPath=clipPath;
            }

            if(clip.type==='video'){
                videoElement.volume=Math.max(0,Math.min(1,volume/100));
                videoElement.playbackRate=Math.max(.1,Math.min(4,speed));
            }
        }

        function getActiveClipAtTime(t){
            return timelineClips.find(c=>t>=Number(c.start||0) && t<=Number(c.start||0)+Number(c.duration||0)) || null;
        }

        
        // 키프레임 속도를 고려한 소스 미디어 시간 변환.
        // 타임라인 1초가 실제 영상 파일에서는 speed에 따라 더 길거나 짧아집니다.
        function mediaTimeForTimeline(clip, timelineLocal){
            ensureClipKeyframes(clip);
            const target=Math.max(0,Math.min(Number(clip.duration)||0,Number(timelineLocal)||0));
            if(target<=0) return 0;
            const steps=Math.max(12,Math.ceil(target*8));
            const dt=target/steps;
            let sum=0;
            for(let i=0;i<steps;i++){
                const a=i*dt, b=(i+1)*dt, m=(a+b)/2;
                const sa=interpolateKeyframes(clip.keyframes.speed,a,Number(clip.speed)||1);
                const sm=interpolateKeyframes(clip.keyframes.speed,m,Number(clip.speed)||1);
                const sb=interpolateKeyframes(clip.keyframes.speed,b,Number(clip.speed)||1);
                sum += (sa+4*sm+sb)*dt/6;
            }
            return Math.max(0,sum);
        }

        function timelineLocalForMedia(clip, mediaTime){
            ensureClipKeyframes(clip);
            const target=Math.max(0,Number(mediaTime)||0);
            if(target<=0) return 0;
            let lo=0, hi=Number(clip.duration)||0;
            for(let i=0;i<24;i++){
                const mid=(lo+hi)/2;
                if(mediaTimeForTimeline(clip,mid)<target) lo=mid;
                else hi=mid;
            }
            return Math.max(0,Math.min(Number(clip.duration)||0,(lo+hi)/2));
        }

function startDirectionalLoop(){
            cancelAnimationFrame(reverseRAF);
            lastReverseStamp=performance.now();
            function tick(stamp){
                if(videoElement.paused){ reverseRAF=null; return; }
                const dt=Math.min(.05,(stamp-lastReverseStamp)/1000); lastReverseStamp=stamp;
                const clip=getActiveClipAtTime(timelineClock);
                if(!clip){ videoElement.pause(); document.getElementById('playBtn').innerText='▶'; reverseRAF=null; return; }
                ensureClipKeyframes(clip);
                const rate=Math.max(.1,Math.min(4,Number(clip.speed)||1));
                let next=timelineClock;
                const dir=clip.direction||'forward';
                if(dir==='reverse') next-=dt*rate;
                else if(dir==='pingpong') next+=dt*rate*pingPongDirection;
                else next+=dt*rate;

                const lo=clip.start, hi=clip.start+clip.duration;
                if(dir==='pingpong'){
                    if(next>=hi){next=hi;pingPongDirection=-1;}
                    if(next<=lo){next=lo;pingPongDirection=1;}
                }else if(dir==='reverse' && next<=lo){ next=lo; videoElement.pause(); document.getElementById('playBtn').innerText='▶'; }
                else if(dir!=='reverse' && next>=hi){ next=hi; videoElement.pause(); document.getElementById('playBtn').innerText='▶'; }
                timelineClock=next;
                const mediaLocal=Math.max(0,Math.min(Number(clip.duration)||0,
                    (timelineClock-Number(clip.start||0))));
                try{videoElement.currentTime=mediaLocal;}catch(_){ }
                applyAnimations(clip,timelineClock);
                if(!videoElement.paused){ reverseRAF=requestAnimationFrame(tick); }
            }
            reverseRAF=requestAnimationFrame(tick);
        }

        function toggleReversePlayback(){
            const clip=getSelectedClip() || getActiveClipAtTime(videoElement.currentTime);
            if(!clip){alert('역재생할 비디오 클립을 선택해주세요.');return;}
            const dir=document.getElementById('directionSelect');
            if(dir){dir.value='reverse';clip.direction='reverse';}
            reversePlayback=true;
            const btn=document.getElementById('reversePlayBtn'); if(btn) btn.classList.add('reverse-active');
            if(timelineClock<=Number(clip.start||0)+.02){
                timelineClock=Number(clip.start||0)+Number(clip.duration||0)-.02;
                videoElement.currentTime=Math.max(0,Number(clip.duration||0)-.02);
            }
            videoElement.pause();
            // play()는 미디어 디코더를 깨워 프레임을 표시하기 위한 용도이며, 실제 역재생은 rAF로 수행
            videoElement.play().then(()=>{videoElement.pause();startDirectionalLoop();}).catch(()=>startDirectionalLoop());
            document.getElementById('playBtn').innerText='❚❚';
        }

        const _oldTogglePlay=togglePlay;
        togglePlay=function(){
            const clip=getActiveClipAtTime(timelineClock) || getSelectedClip();
            if(clip && (clip.direction==='reverse' || clip.direction==='pingpong')){
                if(videoElement.paused){
                    reversePlayback=clip.direction==='reverse';
                    if(clip.direction==='reverse' && timelineClock<=Number(clip.start||0)+.02){
                        timelineClock=Number(clip.start||0)+Number(clip.duration||0)-.02;
                        videoElement.currentTime=Math.max(0,Number(clip.duration||0)-.02);
                    }
                    videoElement.play().then(()=>{videoElement.pause();startDirectionalLoop();}).catch(startDirectionalLoop);
                    document.getElementById('playBtn').innerText='❚❚';
                }else{
                    videoElement.pause(); cancelAnimationFrame(reverseRAF); document.getElementById('playBtn').innerText='▶';
                }
                return;
            }
            _oldTogglePlay();
        };

        const _oldLoadClipProperties=loadClipProperties;
        loadClipProperties=function(clip){
            _oldLoadClipProperties(clip);
            ensureClipKeyframes(clip);
            clip.y=Number(clip.y)||0; clip.rotation=Number(clip.rotation)||0;
            document.getElementById('rangeY').value=clip.y;
            document.getElementById('valY').innerText=clip.y;
            document.getElementById('rangeRotation').value=clip.rotation;
            syncAllNumericFields(); updateFilterUI(clip);
            document.getElementById('valRotation').innerText=clip.rotation;
            document.getElementById('directionSelect').value=clip.direction||'forward';
            document.getElementById('speedNumber').value=clip.speed||1;
            reversePlayback=(clip.direction==='reverse');
            if (document.getElementById('reversePlayBtn')) document.getElementById('reversePlayBtn').classList.toggle('reverse-active', reversePlayback);
            document.getElementById('reversePlayBtn').classList.toggle('reverse-active',reversePlayback);
            renderKeyframeGraph();
        };

        const _oldRenderAllAdvanced=renderAll;
        renderAll=function(){
            timelineClips.forEach(ensureClipKeyframes);
            _oldRenderAllAdvanced();
            const c=getSelectedClip(); if(c) renderKeyframeGraph();
        };

        const _oldTimeUpdate=videoElement.ontimeupdate;
        videoElement.ontimeupdate=function(){
            _oldTimeUpdate && _oldTimeUpdate();
            const active=getActiveClipAtTime(videoElement.currentTime);
            if(active){
                if(lastActiveClipId!==active.id){
                    lastActiveClipId=active.id;
                    ensureClipKeyframes(active);
                }
                applyAnimations(active,videoElement.currentTime);
                applyTransitionPreview(videoElement.currentTime);
                updatePlaybackSettingsForTransition(videoElement.currentTime);
                if(selectedClipIds.includes(active.id)) renderKeyframeGraph();
            }
        };

        function updatePlaybackSettingsForTransition(t){
            const pair=findTransitionPair(t);
            if(!pair || !transitionVideoElement) return;
            const incomingLocal=Math.max(0,Math.min(Number(pair.incoming.duration)||0,t-Number(pair.incoming.start||0)));
            ensureClipKeyframes(pair.incoming);
            const incomingSpeed=interpolateKeyframes(pair.incoming.keyframes.speed,incomingLocal,Number(pair.incoming.speed)||1);
            transitionVideoElement.playbackRate=Math.max(.1,Math.min(4,Number(incomingSpeed)||1));
            transitionVideoElement.volume=0;
        }



        function syncAnimationPresetButtons(){
            const sel=document.getElementById('animSelect');
            const value=sel ? sel.value : 'none';
            document.querySelectorAll('.animation-preset-btn').forEach(btn=>{
                btn.classList.toggle('active',btn.dataset.anim===value);
            });
        }

        document.querySelectorAll('.animation-preset-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
                const clip=getSelectedClip();
                if(!clip) return;
                const value=btn.dataset.anim || 'none';
                const sel=document.getElementById('animSelect');
                if(sel) sel.value=value;
                clip.anim=value;
                clip.animDuration=Number(document.getElementById('animDuration')?.value || clip.animDuration || 1);
                syncAnimationPresetButtons();
                applyAnimations(clip,timelineClock);
                renderTracks();
                renderKeyframeGraph();
            });
        });


        // ===== v6 통합 재생 루프 =====
        // 기존 브라우저 playbackRate 의존 루프 대신 타임라인 시계를 기준으로 제어합니다.
        // 따라서 역재생, 왕복, 키프레임 속도 변화가 모두 같은 기준으로 작동합니다.
        if (videoElement) {
            videoElement.ontimeupdate = function(){};
        }

        function stopCustomPlayback(){
            if(reverseRAF){
                cancelAnimationFrame(reverseRAF);
                reverseRAF=null;
            }
            try{videoElement.pause();}catch(_){}
            try{transitionVideoElement.pause();}catch(_){}
            document.getElementById('playBtn').innerText='▶';
        }

        function customPlaybackTick(stamp){
            if(!reverseRAF) return;

            const dt=Math.min(.05,Math.max(0,(stamp-lastReverseStamp)/1000));
            lastReverseStamp=stamp;

            let active=getActiveClipAtTime(timelineClock);
            if(!active){
                stopCustomPlayback();
                return;
            }
            ensureClipKeyframes(active);

            const local=Math.max(0,Math.min(Number(active.duration)||0,
                timelineClock-Number(active.start||0)));
            const speed=Math.max(.1,Math.min(4,
                interpolateKeyframes(active.keyframes.speed,local,Number(active.speed)||1)));

            const dir=active.direction||'forward';
            let next=timelineClock;

            if(dir==='reverse') next-=dt;
            else if(dir==='pingpong') next+=dt*pingPongDirection;
            else next+=dt;

            const lo=Number(active.start||0);
            const hi=lo+Number(active.duration||0);

            if(dir==='pingpong'){
                if(next>=hi){ next=hi; pingPongDirection=-1; }
                if(next<=lo){ next=lo; pingPongDirection=1; }
            }else if(dir==='reverse' && next<=lo){
                next=lo;
                timelineClock=next;
                setVideoSourceAndTime(videoElement,active,timelineClock);
                applyAnimations(active,timelineClock);
                applyTransitionPreview(timelineClock);
                stopCustomPlayback();
                return;
            }else if(dir!=='reverse' && next>=hi){
                next=hi;
                timelineClock=next;
                setVideoSourceAndTime(videoElement,active,timelineClock);
                applyAnimations(active,timelineClock);
                applyTransitionPreview(timelineClock);
                stopCustomPlayback();
                return;
            }

            timelineClock=next;
            setActiveVisualSource(active,timelineClock);
            applyTransitionPreview(timelineClock);
            updatePlaybackSettingsForTransition(timelineClock);

            const zoomFactor=parseFloat(document.getElementById('zoomRange').value)||30;
            updatePlayheadPosition(timelineClock*zoomFactor);
            timeDisplay.innerText=`${timelineClock.toFixed(1)}s / ${getMaxDuration().toFixed(1)}s`;

            renderKeyframeGraph();

            reverseRAF=requestAnimationFrame(customPlaybackTick);
        }

        function startCustomPlayback(){
            if(reverseRAF) return;
            lastReverseStamp=performance.now();
            reverseRAF=requestAnimationFrame(customPlaybackTick);
        }

        function togglePlay(){
            const active=getActiveClipAtTime(timelineClock) || getSelectedClip() ||
                timelineClips.find(c=>c.type==='video' && c.url);

            if(!active){
                alert('재생할 비디오 클립을 추가하거나 선택해주세요.');
                return;
            }

            if(reverseRAF){
                stopCustomPlayback();
                return;
            }

            if(timelineClock < Number(active.start||0) ||
               timelineClock > Number(active.start||0)+Number(active.duration||0)){
                timelineClock=Number(active.start||0);
            }

            const dir=active.direction||'forward';
            if(dir==='reverse' && timelineClock<=Number(active.start||0)+.01){
                timelineClock=Number(active.start||0)+Number(active.duration||0)-.01;
            }

            pingPongDirection=dir==='reverse' ? -1 : 1;

            setActiveVisualSource(active,timelineClock);
            applyTransitionPreview(timelineClock);

            try{
                videoElement.muted=(dir==='reverse');
                videoElement.play().catch(()=>{});
            }catch(_){}

            document.getElementById('playBtn').innerText='❚❚';
            startCustomPlayback();
        }

        function stopPlayback(){
            stopCustomPlayback();
            timelineClock=0;
            const zoomFactor=parseFloat(document.getElementById('zoomRange').value)||30;
            updatePlayheadPosition(0);
            timeDisplay.innerText=`0.0s / ${getMaxDuration().toFixed(1)}s`;
            const first=timelineClips.find(c=>c.type==='video'&&c.url);
            if(first){
                setVideoSourceAndTime(videoElement,first,first.start);
                applyAnimations(first,first.start);
            }
        }

        function seekRelative(sec){
            const active=getActiveClipAtTime(timelineClock)||getSelectedClip();
            if(!active) return;
            timelineClock=Math.max(Number(active.start||0),
                Math.min(Number(active.start||0)+Number(active.duration||0),timelineClock+Number(sec)||0));
            setActiveVisualSource(active,timelineClock);
            applyTransitionPreview(timelineClock);
            const zoomFactor=parseFloat(document.getElementById('zoomRange').value)||30;
            updatePlayheadPosition(timelineClock*zoomFactor);
        }

        // 선택한 방향/속도를 저장하되, 키프레임 속도가 있으면 그래프가 우선합니다.
        function updatePlaybackSettings(){
            const clip=getSelectedClip();
            const dir=document.getElementById('directionSelect').value;
            const speed=Math.max(.1,Math.min(4,
                parseFloat(document.getElementById('speedNumber').value)||1));

            if(clip){
                clip.direction=dir;
                clip.speed=speed;
                ensureClipKeyframes(clip);
                const local=Math.max(0,Math.min(Number(clip.duration)||0,
                    timelineClock-Number(clip.start||0)));
                const speedPoint=clip.keyframes.speed.find(k=>Math.abs(k.time-local)<.03);
                if(speedPoint) speedPoint.value=speed;
            }

            reversePlayback=dir==='reverse';
            pingPongDirection=1;
            document.getElementById('rangeSpeed').value=Math.min(4,speed);
            document.getElementById('valSpeed').innerText=speed.toFixed(1);
            const btn=document.getElementById('reversePlayBtn');
            if(btn) btn.classList.toggle('reverse-active',reversePlayback);
            renderTracks();
        }


        function toggleReversePlayback(){
            const clip=getSelectedClip() || getActiveClipAtTime(timelineClock) ||
                timelineClips.find(c=>c.type==='video' && c.url);

            if(!clip){
                alert('역재생할 비디오 클립을 선택해주세요.');
                return;
            }

            clip.direction='reverse';
            const dir=document.getElementById('directionSelect');
            if(dir) dir.value='reverse';

            reversePlayback=true;
            pingPongDirection=-1;

            if(timelineClock<=Number(clip.start||0)+.01 ||
               timelineClock>Number(clip.start||0)+Number(clip.duration||0)){
                timelineClock=Number(clip.start||0)+Number(clip.duration||0)-.01;
            }

            try{ videoElement.muted=true; }catch(_){}
            setVideoSourceAndTime(videoElement,clip,timelineClock);
            applyAnimations(clip,timelineClock);
            applyTransitionPreview(timelineClock);

            document.getElementById('playBtn').innerText='❚❚';
            if(!reverseRAF) startCustomPlayback();

            const btn=document.getElementById('reversePlayBtn');
            if(btn) btn.classList.add('reverse-active');
            renderTracks();
        }

        // 속도/볼륨/키프레임을 실제 미리보기에 즉시 적용
        const _v6UpdateProperties=updateProperties;
        updateProperties=function(){
            _v6UpdateProperties();
            const clip=getSelectedClip();
            if(clip){
                ensureClipKeyframes(clip);
                applyAnimations(clip,timelineClock);
                renderKeyframeGraph();
                renderTracks();
            }
        };


        window.addEventListener('resize',()=>{ if(getSelectedClip()) renderKeyframeGraph(); });
        // PWA: 서비스 워커 등록 (있으면 설치 가능한 앱으로 인식됨)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }

        timelineClips.forEach(ensureClipKeyframes);
        renderAll();
        syncAnimationPresetButtons();
    </script>

<script>
/* ===== v12 최종 동작 보정 =====
   1) 애니메이션 버튼을 실제 선택 UI로 사용
   2) 애니메이션 시간 바/숫자 입력을 0.1~10초로 동기화
   3) 속도/볼륨 숫자 입력 ↔ 슬라이더 양방향 동기화
   4) 영상(video)은 속도 변경 시 타임라인 길이를 절대 변경하지 않음
      이미지/텍스트 등 비디오가 아닌 소스만 속도에 따라 타임라인 길이를 조정
*/
(function(){
    const $=id=>document.getElementById(id);

    function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

    function setAnimationFromButton(value){
        const clip=typeof getSelectedClip==='function' ? getSelectedClip() : null;
        if(!clip) return;
        const sel=$('animSelect');
        if(sel) sel.value=value;
        clip.anim=value;
        clip.animDuration=clamp(Number($('animDuration')?.value)||Number(clip.animDuration)||1,.1,10);
        if($('animDuration')) $('animDuration').value=clip.animDuration;
        if($('numberAnimDuration')) $('numberAnimDuration').value=clip.animDuration;
        if($('valAnimDuration')) $('valAnimDuration').innerText=clip.animDuration.toFixed(1)+'s';
        syncAnimationPresetButtons();
        if(typeof applyAnimations==='function') applyAnimations(clip,timelineClock||clip.start||0);
        if(typeof renderTracks==='function') renderTracks();
        if(typeof renderKeyframeGraph==='function') renderKeyframeGraph();
    }

    document.querySelectorAll('#animationPresetGrid .animation-preset-btn').forEach(btn=>{
        btn.onclick=function(e){ e.preventDefault(); e.stopPropagation(); setAnimationFromButton(btn.dataset.anim||'none'); };
        btn.addEventListener('pointerdown',e=>e.stopPropagation());
    });

    // 애니메이션 시간: 슬라이더와 숫자 입력을 모두 같은 값으로 유지
    window.updateEffectDuration=function(){
        const clip=typeof getSelectedClip==='function' ? getSelectedClip() : null;
        if(!clip) return;
        const range=$('animDuration'), num=$('numberAnimDuration');
        let v=clamp(Number(range?.value ?? num?.value)||1,.1,10);
        if(range) range.value=v;
        if(num) num.value=v;
        clip.animDuration=v;
        if($('valAnimDuration')) $('valAnimDuration').innerText=v.toFixed(1)+'s';
        if(typeof applyAnimations==='function') applyAnimations(clip,timelineClock||clip.start||0);
        if(typeof renderTracks==='function') renderTracks();
        if(typeof renderKeyframeGraph==='function') renderKeyframeGraph();
    };

    // 비디오가 아닌 클립만 속도에 따라 길이 변경. 최초 길이는 _baseDuration에 보존.
    function applyNonVideoSpeedDuration(clip, speed){
        if(!clip || clip.type==='video') return;
        if(!Number.isFinite(Number(clip._baseDuration)) || Number(clip._baseDuration)<=0){
            clip._baseDuration=Number(clip.duration)||5;
        }
        const oldEnd=Number(clip.start||0)+Number(clip.duration||0);
        clip.duration=clamp(Number(clip._baseDuration)/Math.max(.1,speed),.1,3600);
        const newEnd=Number(clip.start||0)+clip.duration;
        if(typeof timelineClock!=='undefined' && timelineClock>newEnd) timelineClock=newEnd;
        return {oldEnd,newEnd};
    }

    // 최종 updateProperties 래퍼: 숫자 입력도 반드시 range/label에 반영하고 영상 길이는 고정.
    const previousUpdateProperties=window.updateProperties;
    window.updateProperties=function(){
        if(typeof previousUpdateProperties==='function') previousUpdateProperties();
        const clip=typeof getSelectedClip==='function' ? getSelectedClip() : null;
        if(!clip) return;

        const speed=clamp(Number($('rangeSpeed')?.value)||Number(clip.speed)||1,.1,4);
        clip.speed=speed;
        if($('rangeSpeed')) $('rangeSpeed').value=speed;
        if($('numberSpeed')) $('numberSpeed').value=speed;
        if($('speedNumber')) $('speedNumber').value=speed;
        if($('valSpeed')) $('valSpeed').innerText=speed.toFixed(1);

        const volume=clamp(Number($('rangeVolume')?.value ?? clip.volume ?? 100),0,100);
        clip.volume=volume;
        if($('rangeVolume')) $('rangeVolume').value=volume;
        if($('numberVolume')) $('numberVolume').value=volume;
        if($('valVolume')) $('valVolume').innerText=volume;

        if(clip.type==='video'){
            // 중요: 영상 클립 duration은 speed 변경으로 절대 바꾸지 않음.
            if($('videoElement')){
                $('videoElement').playbackRate=speed;
                $('videoElement').volume=volume/100;
            }
        }else{
            applyNonVideoSpeedDuration(clip,speed);
        }
        if(typeof renderTracks==='function') renderTracks();
        if(typeof applyAnimations==='function') applyAnimations(clip,timelineClock||clip.start||0);
    };

    // 숫자 입력에서 직접 값을 바꿀 때도 즉시 반영
    if($('numberSpeed')) $('numberSpeed').addEventListener('change',function(){
        const v=clamp(Number(this.value)||1,.1,4);
        this.value=v;
        if($('rangeSpeed')) $('rangeSpeed').value=v;
        window.updateProperties();
    });
    if($('numberVolume')) $('numberVolume').addEventListener('change',function(){
        const v=clamp(Number(this.value)||0,0,100);
        this.value=v;
        if($('rangeVolume')) $('rangeVolume').value=v;
        window.updateProperties();
    });
    if($('speedNumber')) $('speedNumber').addEventListener('change',function(){
        const v=clamp(Number(this.value)||1,.1,4);
        this.value=v;
        if($('rangeSpeed')) $('rangeSpeed').value=v;
        if($('numberSpeed')) $('numberSpeed').value=v;
        window.updateProperties();
    });

    // 클립 로드 시 비디오의 원래 duration은 보존, 비디오 외 소스의 기준 duration도 보존
    const previousLoadClipProperties=window.loadClipProperties;
    window.loadClipProperties=function(clip){
        if(clip && clip.type!=='video' && !Number.isFinite(Number(clip._baseDuration))) clip._baseDuration=Number(clip.duration)||5;
        if(typeof previousLoadClipProperties==='function') previousLoadClipProperties(clip);
        if(!clip) return;
        const speed=clamp(Number(clip.speed)||1,.1,4);
        if($('rangeSpeed')) $('rangeSpeed').value=speed;
        if($('numberSpeed')) $('numberSpeed').value=speed;
        if($('speedNumber')) $('speedNumber').value=speed;
        const speedGroup=$('speedGroup'), volumeGroup=$('volumeGroup');
        if(speedGroup) speedGroup.style.display='block';
        if(volumeGroup) volumeGroup.style.display=(clip.type==='video'?'block':'none');

        const volume=clamp(Number(clip.volume ?? 100),0,100);
        if($('rangeVolume')) $('rangeVolume').value=volume;
        if($('numberVolume')) $('numberVolume').value=volume;
        if($('valVolume')) $('valVolume').innerText=volume;
        const ad=clamp(Number(clip.animDuration)||1,.1,10);
        if($('animDuration')) $('animDuration').value=ad;
        if($('numberAnimDuration')) $('numberAnimDuration').value=ad;
        if($('valAnimDuration')) $('valAnimDuration').innerText=ad.toFixed(1)+'s';
        syncAnimationPresetButtons();
    };

    // 최초 로딩에서도 버튼 상태가 맞도록 동기화
    syncAnimationPresetButtons();
})();
</script>
